/* ================= Menus (slash, block options, more) ================= */
const menuEl=$('#menu');
let menu={open:false, mode:null, blockId:null, query:'', start:0, items:[], active:0};

function filterTypes(q){   // ranked like Notion: name matches first, hidden keywords after
  q=q.toLowerCase(); if(!q) return TYPES.slice();
  const score=t=>{
    const l=t.label.toLowerCase(), keys=t.keys.split(' ');
    if(l.startsWith(q)) return 0;                                   // "/b"  → Bulleted list
    if(l.split(/[\s-]+/).some(w=>w.startsWith(q))) return 1;        // "/list" → Bulleted list, Numbered list…
    if(keys.includes(q)) return 2;                                  // "/h2" → Heading 2
    if(keys.some(k=>k.startsWith(q))) return 3;                     // "/bi" → Heading 1 ("big")
    if(l.includes(q)) return 4;
    return 9;
  };
  return TYPES.map((t,i)=>({t,i,s:score(t)})).filter(x=>x.s<9).sort((a,b)=>a.s-b.s || a.i-b.i).map(x=>x.t);
}
function checkSlash(el, b){
  if(!el || b.type==='code'){ if(menu.mode==='slash') closeMenu(); return; }
  const off=caretOffset(el);
  const m=el.textContent.slice(0,off).match(/(^|[\s ])\/([a-z0-9-]*)$/i);
  if(!m){ if(menu.mode==='slash') closeMenu(); return; }
  const q=m[2], items=filterTypes(q);
  if(!items.length && q.length>=4){ closeMenu(); return; }
  const wasOpen = menu.open && menu.mode==='slash' && menu.blockId===b.id;
  menu={open:true, mode:'slash', blockId:b.id, query:q, start:off-q.length-1, items, active:0};
  renderMenu();
  if(!wasOpen) positionMenu(caretRect(el));
}
function renderMenu(){
  let html='';
  if(menu.mode==='slash'){
    html+='<div class="menu-section">Basic blocks</div>';
    if(!menu.items.length) html+='<div class="menu-empty">No results</div>';
  }
  menu.items.forEach((it,i)=>{
    if(it.section) html+=`<div class="menu-section">${it.section}</div>`;
    html+=`<div class="menu-item${i===menu.active?' active':''}" data-i="${i}"><div class="mi-icon">${iconHtml(it.icon)}</div><div><div class="mi-label">${esc(it.label)}</div>${it.desc&&menu.mode==='slash'?`<div class="mi-desc">${esc(it.desc)}</div>`:''}</div>${it.md?`<span class="mi-key">${esc(it.md)}</span>`:''}</div>`;
  });
  menuEl.innerHTML=html;
  menuEl.classList.toggle('compact', menu.mode!=='slash');
  menuEl.classList.add('open'); menu.open=true;
  highlightMenu();
}
function highlightMenu(){
  menuEl.querySelectorAll('.menu-item').forEach(x=>x.classList.toggle('active', +x.dataset.i===menu.active));
  const a=menuEl.querySelector('.menu-item.active'); if(a) a.scrollIntoView({block:'nearest'});
}
function positionMenu(rect){
  const mh=menuEl.offsetHeight, mw=menuEl.offsetWidth;
  let top=rect.bottom+6;
  if(top+mh > innerHeight-10) top=Math.max(10, rect.top-mh-6);
  const left=Math.max(10, Math.min(rect.left, innerWidth-mw-10));
  menuEl.style.top=top+'px'; menuEl.style.left=left+'px';
}
function closeMenu(){ menu.open=false; menu.mode=null; menuEl.classList.remove('open'); }

function pickMenu(i){
  const it=menu.items[i]; if(!it) return;
  if(menu.mode==='slash'){
    const el=contentEl(menu.blockId), b=getBlock(menu.blockId);
    const [sn,so]=pointAt(el, menu.start), [en,eo]=pointAt(el, menu.start+1+menu.query.length);
    const r=document.createRange(); r.setStart(sn,so); r.setEnd(en,eo); r.deleteContents();
    if(!el.textContent) el.innerHTML='';
    syncBlock(el); convert(b, it.type);
  } else { closeMenu(); it.run(); }
}
function openActions(items, anchor, mode='actions', blockId=null){
  menu={open:true, mode, blockId, query:'', start:0, items, active:0};
  renderMenu(); positionMenu(anchor.getBoundingClientRect());
}
function openBlockMenu(id, anchor){
  if(!selected.has(id)) selectBlocks([id]);    // like Notion: the handle selects its block
  const list=selectedInOrder(), ids=list.map(b=>b.id), many=ids.length>1, b=getBlock(id);
  const rect=anchor.getBoundingClientRect();
  const items=[
    {section: many ? `${ids.length} blocks selected` : 'Actions', label:'Delete', icon:'i:trash-outline', run:()=>deleteBlocks(ids)},
    {label:'Duplicate', icon:'i:copy-outline', run:()=>duplicateBlocks(ids)},
    {label:'Copy',      icon:'i:clipboard-outline', run:()=>copyBlocks(list)},
    {label:'Color',     icon:'i:color-palette-outline', run:()=>openColorPanel('block', rect, ids)},
  ];
  if(!many) items.push(
    {label:'Move up',   icon:'i:arrow-up-outline',   run:()=>moveBlock(id,-1)},
    {label:'Move down', icon:'i:arrow-down-outline', run:()=>moveBlock(id,1)});
  if(list.some(x=>x.type!=='divider' && x.type!=='page')){
    TYPES.filter(t=>t.type!=='divider' && (many || t.type!==b.type))
      .forEach((t,k)=>items.push({section:k===0?'Turn into':null, label:t.label, icon:t.icon, run:()=>convertMany(ids, t.type)}));
  }
  openActions(items, anchor, 'block', id);
}

menuEl.addEventListener('mousedown', e=>e.preventDefault());   // keep the caret in the block
menuEl.addEventListener('click', e=>{ const it=e.target.closest('.menu-item'); if(it) pickMenu(+it.dataset.i); });
menuEl.addEventListener('mousemove', e=>{
  const it=e.target.closest('.menu-item');
  if(it && +it.dataset.i!==menu.active){ menu.active=+it.dataset.i; menuEl.querySelectorAll('.menu-item').forEach(x=>x.classList.toggle('active', x===it)); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && cp.classList.contains('open')){ e.preventDefault(); e.stopPropagation(); hideColorPanel(); return; }
  if(!menu.open) return;
  const n=menu.items.length;
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault(); e.stopPropagation();
    if(n){ menu.active=(menu.active+(e.key==='ArrowDown'?1:-1)+n)%n; highlightMenu(); }
    return;
  }
  if(e.key==='Enter' || e.key==='Tab'){
    if(n){ e.preventDefault(); e.stopPropagation(); pickMenu(menu.active); } else closeMenu();
    return;
  }
  if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeMenu(); return; }
  if(menu.mode!=='slash' || e.key==='ArrowLeft' || e.key==='ArrowRight') closeMenu();
}, true);
document.addEventListener('mousedown', e=>{
  if(menu.open && !menuEl.contains(e.target)) closeMenu();
  if(cp.classList.contains('open') && !cp.contains(e.target) && !e.target.closest('#toolbar')) hideColorPanel();
  if(selected.size && !marq && !(e.shiftKey && e.target.closest('.block'))
     && !e.target.closest('#menu, #colorPanel, #toolbar, .gutter, #modal')) clearSelection();
  const pop=$('#emojiPop');
  if(pop.classList.contains('open') && !pop.contains(e.target) && !e.target.closest('#pageIcon')) pop.classList.remove('open');
});
$('#scroller').addEventListener('scroll', ()=>{ closeMenu(); hideColorPanel(); if(tb.classList.contains('open')) onSelChange(); });
window.addEventListener('resize', closeMenu);

/* ================= Selection toolbar (Notion-style) ================= */
const tb=$('#toolbar'), cp=$('#colorPanel');
const cap = s => s[0].toUpperCase()+s.slice(1);

function blockOfPoint(node, offset){   // which block a selection end sits in
  if(!node) return null;
  const e = node.nodeType===3 ? node.parentElement : node;
  if(e===editor){ const c=editor.children[Math.min(offset, editor.children.length-1)]; return c && c.classList.contains('block') ? c : null; }
  return e && e.closest ? e.closest('#blocks .block') : null;
}
let selRaf=0, pendingCross=false, previewIds=[];
document.addEventListener('selectionchange', ()=>{ cancelAnimationFrame(selRaf); selRaf=requestAnimationFrame(onSelChange); });

function onSelChange(){
  const s=getSelection();
  if(!s.rangeCount || s.isCollapsed){
    hideToolbar();
    if(pendingCross){ pendingCross=false; paintSelection(); }
    return;
  }
  const a=blockOfPoint(s.anchorNode, s.anchorOffset), f=blockOfPoint(s.focusNode, s.focusOffset);
  if(!a || !f){ hideToolbar(); return; }
  if(a!==f){   // text selection crosses blocks → becomes a block selection (finalized on mouse/shift release)
    hideToolbar(); pendingCross=true;
    previewIds=rangeIds(a.dataset.id, f.dataset.id);
    editor.querySelectorAll('.block').forEach(el=>el.classList.toggle('selected', previewIds.includes(el.dataset.id)));
    return;
  }
  if(pendingCross){ pendingCross=false; paintSelection(); }
  const b=getBlock(a.dataset.id);
  if(!b || b.type==='code' || b.type==='divider' || !a.querySelector('.content').contains(s.getRangeAt(0).commonAncestorContainer)){ hideToolbar(); return; }
  showToolbar(s.getRangeAt(0), b);
}
function finalizeCross(){
  cancelAnimationFrame(selRaf); onSelChange();   // use the latest selection
  if(!pendingCross) return;
  pendingCross=false;
  const ids=previewIds; getSelection().removeAllRanges();
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  selectBlocks(ids, ids[0]);
}
document.addEventListener('mouseup', ()=>setTimeout(finalizeCross));
document.addEventListener('keyup', e=>{ if(e.key==='Shift') finalizeCross(); });

function showToolbar(range, b){
  $('#turnLabel').textContent = TYPES.find(t=>t.type===b.type).label;
  tb.querySelectorAll('[data-cmd]').forEach(x=>{ let on=false; try{ on=document.queryCommandState(x.dataset.cmd); }catch(e){} x.classList.toggle('on', on); });
  const last=state.recent[0];
  $('#colorA').style.textDecorationColor = last ? (last.startsWith('c:') ? `var(--c-${last.slice(2)})` : `var(--b-${last.slice(3)})`) : '';
  tb.classList.add('open');
  const r=range.getBoundingClientRect(), w=tb.offsetWidth, h=tb.offsetHeight;
  let top=r.top-h-8; if(top<50) top=r.bottom+8;
  tb.style.top=top+'px';
  tb.style.left=Math.max(10, Math.min(r.left+r.width/2-w/2, innerWidth-w-10))+'px';
}
function hideToolbar(){ tb.classList.remove('open'); if(cpMode==='inline') hideColorPanel(); }

tb.addEventListener('mousedown', e=>e.preventDefault());   // keep the text selected
tb.addEventListener('click', e=>{
  const btn=e.target.closest('button'); if(!btn) return;
  const s=getSelection(); if(!s.rangeCount) return;
  const blk=blockOfPoint(s.anchorNode, s.anchorOffset); if(!blk) return;
  const el=blk.querySelector('.content'), id=blk.dataset.id;
  if(btn.dataset.cmd){ document.execCommand(btn.dataset.cmd); syncBlock(el); save(); onSelChange(); return; }
  const act=btn.dataset.act;
  if(act==='link') linkSelection(el);
  else if(act==='code') toggleInlineCode(el);
  else if(act==='color') cp.classList.contains('open') ? hideColorPanel() : openColorPanel('inline', btn.getBoundingClientRect());
  else if(act==='turn'){
    hideColorPanel();
    openActions(TYPES.filter(t=>t.type!=='divider').map(t=>({label:t.label, icon:t.icon, run:()=>convert(getBlock(id), t.type)})), btn, 'actions');
  }
});

function linkSelection(el){
  const sel=getSelection();
  if(!sel.rangeCount || sel.isCollapsed){ setStatus('Select some text first, then press Ctrl+K'); return; }
  const saved=sel.getRangeAt(0).cloneRange();
  let url=prompt('Link address:', 'https://');
  if(!url || !url.trim() || url.trim()==='https://') return;
  url=url.trim(); if(!/^https?:\/\//i.test(url)) url='https://'+url;
  el.focus(); sel.removeAllRanges(); sel.addRange(saved);
  document.execCommand('createLink', false, url);
  syncBlock(el); save();
}
function toggleInlineCode(el){
  const s=getSelection(); const r=s.getRangeAt(0);
  const start = r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer;
  const inCode = start.closest('code');
  if(inCode && el.contains(inCode)){ inCode.replaceWith(...inCode.childNodes); }
  else{
    const c=document.createElement('code'); c.textContent=r.toString();
    r.deleteContents(); r.insertNode(c);
    const nr=document.createRange(); nr.selectNodeContents(c); s.removeAllRanges(); s.addRange(nr);
  }
  syncBlock(el); save(); onSelChange();
}

/* ----- Text color / highlight on a text selection -----
   Colors are stored as <span data-c="red"> (text) and <span data-bg="yellow"> (highlight). */
function nearestColorSpan(node, kind, el){
  for(let e=node.parentElement; e && e!==el; e=e.parentElement) if(e.tagName==='SPAN' && e.hasAttribute('data-'+kind)) return e;
  return null;
}
function isolate(node, anc){   // split `anc` so it wraps `node` only
  const before=document.createRange(); before.setStart(anc,0); before.setEndBefore(node);
  const after=document.createRange();  after.setStartAfter(node); after.setEnd(anc, anc.childNodes.length);
  const bf=before.extractContents(), af=after.extractContents();
  if(bf.textContent){ const a=anc.cloneNode(false); a.appendChild(bf); anc.before(a); }
  if(af.textContent){ const a=anc.cloneNode(false); a.appendChild(af); anc.after(a); }
}
function tidySpans(el){
  el.querySelectorAll('span').forEach(s=>{ if(!s.textContent) s.remove(); else if(!s.attributes.length) s.replaceWith(...s.childNodes); });
  el.querySelectorAll('span').forEach(s=>{   // merge neighbours with identical colors
    let n=s.nextSibling;
    while(n && n.nodeType===1 && n.tagName==='SPAN' && n.getAttribute('data-c')===s.getAttribute('data-c') && n.getAttribute('data-bg')===s.getAttribute('data-bg')){
      while(n.firstChild) s.appendChild(n.firstChild);
      const next=n.nextSibling; n.remove(); n=next;
    }
  });
}
function applyInline(kind, color){
  const s=getSelection(); if(!s.rangeCount || s.isCollapsed) return;
  const r=s.getRangeAt(0);
  const ca=r.commonAncestorContainer, el=(ca.nodeType===3?ca.parentElement:ca).closest('.content');
  if(!el || !editor.contains(el)) return;
  // cut the boundary text nodes so the selection starts and ends on whole text nodes
  let sc=r.startContainer, so=r.startOffset, ec=r.endContainer, eo=r.endOffset;
  if(ec.nodeType===3 && eo<ec.length) ec.splitText(eo);
  if(sc.nodeType===3 && so>0){ const ns=sc.splitText(so); if(ec===sc) ec=ns; sc=ns; so=0; }
  const rr=document.createRange();
  sc.nodeType===3 ? rr.setStart(sc,0) : rr.setStart(sc,so);
  ec.nodeType===3 ? rr.setEnd(ec,ec.length) : rr.setEnd(ec,eo);
  const texts=[]; const w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let t;
  while((t=w.nextNode())) if(t.length && rr.intersectsNode(t)) texts.push(t);
  if(!texts.length) return;
  texts.forEach(t=>{
    const anc=nearestColorSpan(t, kind, el);
    if(anc){
      isolate(t, anc);
      if(color==='default') anc.removeAttribute('data-'+kind); else anc.setAttribute('data-'+kind, color);
    } else if(color!=='default'){
      const sp=document.createElement('span'); sp.setAttribute('data-'+kind, color);
      t.before(sp); sp.appendChild(t);
    }
  });
  tidySpans(el);
  const last=texts[texts.length-1];
  const nr=document.createRange(); nr.setStart(texts[0],0); nr.setEnd(last,last.length);
  s.removeAllRanges(); s.addRange(nr);
  syncBlock(el); save();
  rememberColor(kind, color);
}
function rememberColor(kind, color){
  if(color==='default') return;
  const key=kind+':'+color;
  state.recent=[key, ...state.recent.filter(x=>x!==key)].slice(0,5);
  save(false);
}

/* ----- Color panel (used by the toolbar and by the block menu) ----- */
let cpMode=null, cpIds=null;
function openColorPanel(mode, rect, ids){
  cpMode=mode; cpIds=ids||null;
  const item=(k,c)=>{
    const label=(c==='default'?'Default':cap(c)) + (k==='c'?' text':' background');
    const style = k==='c' ? `color:${c==='default'?'var(--text)':`var(--c-${c})`}`
                          : `background:${c==='default'?'transparent':`var(--b-${c})`}`;
    return `<div class="cp-item" data-k="${k}" data-col="${c}"><span class="sw" style="${style}">A</span><span>${label}</span></div>`;
  };
  let html='';
  if(state.recent.length) html+='<div class="menu-section">Last used</div>'+state.recent.map(x=>{ const [k,c]=x.split(':'); return item(k,c); }).join('');
  html+='<div class="menu-section">Text color</div>'+['default',...COLORS].map(c=>item('c',c)).join('');
  html+='<div class="menu-section">Background color</div>'+['default',...COLORS].map(c=>item('bg',c)).join('');
  cp.innerHTML=html; cp.scrollTop=0; cp.classList.add('open');
  const h=cp.offsetHeight, w=cp.offsetWidth;
  let top=rect.bottom+6; if(top+h>innerHeight-10) top=Math.max(10, rect.top-h-6);
  cp.style.top=top+'px'; cp.style.left=Math.max(10, Math.min(rect.left, innerWidth-w-10))+'px';
}
function hideColorPanel(){ cp.classList.remove('open'); cpMode=null; }
cp.addEventListener('mousedown', e=>e.preventDefault());
cp.addEventListener('click', e=>{
  const it=e.target.closest('.cp-item'); if(!it) return;
  const k=it.dataset.k, c=it.dataset.col, mode=cpMode, ids=cpIds;
  hideColorPanel();
  if(mode==='inline') applyInline(k,c);
  else if(mode==='block'){ setBlockColor(ids,k,c); rememberColor(k,c); }
});

/* ================= Block selection ================= */
function selectedInOrder(){ return blocks().filter(b=>selected.has(b.id)); }
function rangeIds(a, b){
  const i=idx(a), j=idx(b); if(i<0 || j<0) return [];
  return blocks().slice(Math.min(i,j), Math.max(i,j)+1).map(x=>x.id);
}
function paintSelection(){ editor.querySelectorAll('.block').forEach(el=>el.classList.toggle('selected', selected.has(el.dataset.id))); }
function selectBlocks(ids, anchor){
  selected=new Set(ids); selAnchor=anchor || ids[0] || null; selFocus=null;
  paintSelection(); hideToolbar(); closeMenu();
}
function clearSelection(){ if(!selected.size) return; selected.clear(); selAnchor=selFocus=null; paintSelection(); }
editor.addEventListener('focusin', e=>{ if(e.target.classList.contains('content')) clearSelection(); });

/* Shift+click extends a block selection */
editor.addEventListener('mousedown', e=>{
  if(!e.shiftKey || !selected.size) return;
  const blk=blockOf(e.target); if(!blk || e.target.closest('.gutter')) return;
  e.preventDefault();
  selFocus=blk.dataset.id;
  selected=new Set(rangeIds(selAnchor || selectedInOrder()[0].id, selFocus)); paintSelection();
});

/* Dragging the mouse from the text of one block into another selects whole blocks
   (each block is its own editing area, so the browser cannot select text across them) */
let textDrag=null;
function blockAtY(y){
  const els=[...editor.querySelectorAll('.block')]; if(!els.length) return null;
  for(const el of els){ const r=el.getBoundingClientRect(); if(y < r.bottom) return el; }
  return els[els.length-1];
}
editor.addEventListener('mousedown', e=>{
  if(e.button!==0 || e.shiftKey) return;
  const c=e.target.closest('.content'); if(!c) return;
  textDrag={startId:blockOf(c).dataset.id, active:false};
});
document.addEventListener('mousemove', e=>{
  if(!textDrag) return;
  if(!(e.buttons & 1)){ textDrag=null; return; }
  const blk=blockAtY(e.clientY); if(!blk) return;
  const hid=blk.dataset.id;
  if(!textDrag.active && hid!==textDrag.startId){
    textDrag.active=true; document.body.classList.add('marquee-on');
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  if(!textDrag.active) return;
  e.preventDefault();
  getSelection().removeAllRanges();
  selected=new Set(rangeIds(textDrag.startId, hid)); selAnchor=textDrag.startId; selFocus=hid;
  paintSelection(); hideToolbar();
  const sr=scroller.getBoundingClientRect();
  if(e.clientY > sr.bottom-30) scroller.scrollTop+=14; else if(e.clientY < sr.top+30) scroller.scrollTop-=14;
});
document.addEventListener('mouseup', ()=>{
  if(!textDrag) return;
  if(textDrag.active){ getSelection().removeAllRanges(); document.body.classList.remove('marquee-on'); }
  textDrag=null;
});

/* Drag a box in the empty space around the blocks */
const scroller=$('#scroller'), marqEl=$('#marquee');
let marq=null, marqueeJustEnded=false;
scroller.addEventListener('mousedown', e=>{
  if(e.button!==0) return;
  if(e.target===scroller && e.offsetX>=scroller.clientWidth) return;   // the scrollbar
  if(e.target.closest('.block, button, input, a, #pageTitle, #pageIcon')) return;
  e.preventDefault();
  if(document.activeElement && document.activeElement!==document.body) document.activeElement.blur();
  getSelection().removeAllRanges(); closeMenu(); hideColorPanel();

document.addEventListener('mousemove', e=>{

  else if(e.clientY < sr.top+30) scroller.scrollTop-=14;
  const L=Math.min(marq.x,e.clientX), T=Math.min(marq.y,e.clientY), R=Math.max(marq.x,e.clientX), B=Math.max(marq.y,e.clientY);
  Object.assign(marqEl.style, {display:'block', left:L+'px', top:T+'px', width:(R-L)+'px', height:(B-T)+'px'});
  const ids=new Set(marq.base);
  editor.querySelectorAll('.block').forEach(el=>{
    const r=el.querySelector('.body').getBoundingClientRect();
    if(r.bottom>T && r.top<B && r.right>L && r.left<R) ids.add(el.dataset.id);
  });

});

/* Keys while blocks are selected */
document.addEventListener('keydown', e=>{
  if(!selected.size || menu.open || $('#modal').classList.contains('open')) return;
  const ae=document.activeElement;
  if(ae && (ae.isContentEditable || /^(INPUT|TEXTAREA)$/.test(ae.tagName))) return;
  const mod=e.ctrlKey||e.metaKey, key=e.key.toLowerCase(), list=selectedInOrder(), ids=list.map(b=>b.id);
  if(!list.length) return;
  if(e.key==='Backspace' || e.key==='Delete'){ e.preventDefault(); deleteBlocks(ids); }
  else if(e.key==='Escape'){ e.preventDefault(); clearSelection(); }
  else if(mod && key==='c'){ e.preventDefault(); copyBlocks(list); }
  else if(mod && key==='x'){ e.preventDefault(); copyBlocks(list); deleteBlocks(ids); }
  else if(mod && key==='d'){ e.preventDefault(); duplicateBlocks(ids); }
  else if(mod && key==='a'){ e.preventDefault(); selectBlocks(blocks().map(b=>b.id)); }
  else if(e.key==='Tab'){ e.preventDefault(); if(indentBlocks(ids, e.shiftKey?-1:1)){ renderBlocks(); save(); } }
  else if(e.key==='Enter'){
    e.preventDefault(); const t=list.find(b=>b.type!=='divider'); clearSelection(); if(t) focusBlock(t.id,'end');
  }
  else if(e.key==='ArrowUp' || e.key==='ArrowDown'){
    e.preventDefault();
    const dir=e.key==='ArrowUp'?-1:1;
    const vis=[...editor.querySelectorAll('.block')].map(x=>x.dataset.id);   // only blocks you can see
    const step=id=>vis[Math.max(0, Math.min(vis.length-1, vis.indexOf(id)+dir))];
    const shown=ids.filter(id=>vis.includes(id));
    if(e.shiftKey){
      const anchor=selAnchor || shown[0];
      const from=selFocus || (dir<0 ? shown[0] : shown[shown.length-1]);
      selFocus=step(from);
      selected=new Set(rangeIds(anchor, selFocus)); selAnchor=anchor;
    } else {
      const edge = dir<0 ? shown[0] : shown[shown.length-1];
      selected=new Set([step(edge)]); selAnchor=[...selected][0]; selFocus=null;
    }
    paintSelection();
    const el=editor.querySelector(`.block[data-id="${selFocus || selAnchor}"]`); if(el) el.scrollIntoView({block:'nearest'});
  }
});

/* Copy / paste whole blocks */
function copyBlocks(list){
  list=withDescendants(list.map(b=>b.id));
  const text=blocksToMd(list).trim();
  const pages={};   // snapshot of copied sub-pages, so pasting (even after Cut) recreates them
  list.forEach(b=>{ if(b.type==='page' && getPage(b.pageId)) pages[b.pageId]=snapshotTree(b.pageId); });
  clip={text, blocks:list.filter(b=>b.type!=='page' || pages[b.pageId]).map(b=>({...b})), pages};
  const fallback=()=>{
    const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0;top:0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove();
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallback); else fallback();
  setStatus(`Copied ${list.length} block${list.length===1?'':'s'}`);
}
function pasteBlocks(afterId){
  const bl=blocks(), i=idx(afterId), cb=getBlock(afterId);
  const copies=clip.blocks.map(b=>({...b, id:uid()}));
  copies.forEach(c=>{ if(c.type==='page') c.pageId=instantiateTree(JSON.parse(JSON.stringify(clip.pages[c.pageId])), cur().id); });
  renderSidebar();
  const delta=(cb ? cb.indent : 0) - Math.min(...copies.map(c=>c.indent||0));   // land at the level of the target block
  copies.forEach(c=>c.indent=Math.max(0, (c.indent||0)+delta));
  if(cb && cb.type==='text' && isEmpty(cb)) bl.splice(i,1,...copies); else bl.splice(subtreeEnd(i),0,...copies);
  clearSelection(); renderBlocks();
  const last=copies[copies.length-1];
  if(last.type!=='divider') focusBlock(last.id,'end');
  save();
}
document.addEventListener('paste', e=>{
  if(!selected.size || !clip) return;
  const t=e.target.nodeType===1 ? e.target : e.target.parentElement;
  if(t && t.closest('.content, input, textarea, #pageTitle')) return;
  const text=(e.clipboardData || window.clipboardData).getData('text/plain').replace(/\r/g,'');
  if(text===clip.text){ e.preventDefault(); const list=selectedInOrder(); pasteBlocks(list[list.length-1].id); }
});

/* ================= Export / import ================= */
function htmlToMd(html){
  const d=document.createElement('div'); d.innerHTML=html;
  const walk=n=>[...n.childNodes].map(c=>{
    if(c.nodeType===3) return c.textContent.replace(/ /g,' ');
    if(c.nodeType!==1) return '';
    const inner=walk(c);
    switch(c.tagName){
      case 'B': case 'STRONG': return inner.trim()?`**${inner}**`:inner;
      case 'I': case 'EM': return inner.trim()?`*${inner}*`:inner;
      case 'S': case 'STRIKE': return `~~${inner}~~`;
      case 'CODE': return '`'+inner+'`';
      case 'BR': return '\n';
      case 'A': return `[${inner}](${c.getAttribute('href')||''})`;
      default: return inner;
    }
  }).join('');
  return walk(d).replace(/\n+$/,'');
}
function pageToMd(p){ return `# ${p.title||'Untitled'}\n\n` + blocksToMd(p.blocks); }
function blocksToMd(list){
  let out='', prevList=false; const counters=[];
  const base=Math.min(...list.map(b=>b.indent||0));
  list.forEach(b=>{
    const d=(b.indent||0)-base, pad='  '.repeat(d);
    const isList=LIST_TYPES.includes(b.type) || b.type==='toggle';
    if(prevList && !isList) out+='\n';
    counters.length=d+1; counters[d] = b.type==='numbered' ? (counters[d]||0)+1 : 0;
    const t = b.type==='code' ? plainText(b.html) : htmlToMd(b.html);
    switch(b.type){
      case 'h1': out+=`# ${t}\n\n`; break;
      case 'h2': out+=`## ${t}\n\n`; break;
      case 'h3': out+=`### ${t}\n\n`; break;
      case 'bullet': case 'toggle': out+=`${pad}- ${t}\n`; break;
      case 'numbered': out+=`${pad}${counters[d]}. ${t}\n`; break;
      case 'todo': out+=`${pad}- [${b.checked?'x':' '}] ${t}\n`; break;
      case 'quote': out+=`> ${t.replace(/\n/g,'\n> ')}\n\n`; break;
      case 'callout': out+=`> **Note:** ${t.replace(/\n/g,'\n> ')}\n\n`; break;
      case 'code': out+='```\n'+t+'\n```\n\n'; break;
      case 'divider': out+='---\n\n'; break;
      case 'page': { const pg=getPage(b.pageId); out+=`${pad}**${pg ? (pg.title||'Untitled') : 'Page'}** (page)\n\n`; break; }
      default: out+=pad+t+'\n\n';
    }
    prevList=isList;
  });
  return out.trim()+'\n';
}
function download(name, text, type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

  }catch(err){ alert('This file is not a valid StudyNotes backup.'); }

/* ================= Share links =================
   Link format:  index.html#share=<code>
   <code> = "z" + base64url(deflate(JSON))   (or "j" + base64url(JSON) if the browser cannot compress)
   JSON   = {v:2, p:[page, page…]}   p[0] = the shared page, the rest = pages inside it
            page = {t:title, i:icon, P:index of parent page (-1 for p[0]), b:[{t:type, h:html, c, k, d, x, g:index of linked page}]}
   Version 1 links (one page: {v:1, t, i, b}) still open.                                           */
function toB64url(bytes){
  let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function fromB64url(str){
  str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='=';
  return Uint8Array.from(atob(str), c=>c.charCodeAt(0));
}
async function pipeBytes(bytes, stream){
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
}
async function encodeShare(p){
  const list=collectTree(p.id), index=new Map(list.map((x,k)=>[x.id,k]));   // this page + pages inside it, never its parents
  const data={v:2, p:list.map((pg,k)=>({
    t:pg.title, i:pg.icon, P: k===0 ? -1 : index.get(pg.parentId),
    b:pg.blocks.map(b=>{
      const o={t:b.type, h:b.html};
      if(b.checked) o.c=1; if(b.color) o.k=b.color; if(b.indent) o.d=b.indent; if(b.type==='toggle' && !b.open) o.x=1;
      if(b.type==='page'){ if(!index.has(b.pageId)) return null; o.g=index.get(b.pageId); o.h=''; }
      return o;
    }).filter(Boolean)
  }))};
  const bytes=new TextEncoder().encode(JSON.stringify(data));
  if(window.CompressionStream){ try{ return 'z'+toB64url(await pipeBytes(bytes, new CompressionStream('deflate-raw'))); }catch(e){} }
  return 'j'+toB64url(bytes);
}
async function decodeShare(code){
  let bytes=fromB64url(code.slice(1));
  if(code[0]==='z') bytes=await pipeBytes(bytes, new DecompressionStream('deflate-raw'));
  else if(code[0]!=='j') throw new Error('unknown format');
  const d=JSON.parse(new TextDecoder().decode(bytes));
  const raw = d && d.v===2 && Array.isArray(d.p) ? d.p.slice(0,300) : (d && Array.isArray(d.b) ? [{t:d.t, i:d.i, P:-1, b:d.b}] : null);
  if(!raw || !raw.length || !raw.every(x=>x && Array.isArray(x.b))) throw new Error('no pages');
  const ids=raw.map(()=>uid());   // fresh ids; parent and page links are rebuilt from the indexes
  const pages=raw.map((x,k)=>{
    const P=Number.isInteger(x.P) && x.P>=0 && x.P<k ? ids[x.P] : null;
    const pg=cleanPage({   // cleanPage sanitizes every block: only safe formatting and http(s) links survive
      id:ids[k], title:String(x.t||''), icon:String(x.i||''), parentId: k===0 ? null : (P || ids[0]), updated:Date.now(),
      blocks:x.b.filter(y=>y && typeof y==='object').slice(0,5000).map(y=>({
        type:String(y.t), html:String(y.h||''), checked:!!y.c, color:String(y.k||''), indent:y.d, open:!y.x,
        pageId: Number.isInteger(y.g) && y.g>0 && y.g<ids.length ? ids[y.g] : ''}))
    });
    pg.blocks=pg.blocks.filter(b=>b.type!=='page' || b.pageId);
    if(!pg.blocks.length) pg.blocks.push(newBlock());
    return pg;
  });
  return pages;   // pages[0] = the shared page
}

function nlinkHistory() {
  const key=nlinkChatKey();
  if(!nlinkChats.has(key)) nlinkChats.set(key,[]);
  return nlinkChats.get(key);
}
function nlinkInlineMarkdown(value) {
  let text=esc(String(value));
  const protectedParts=[];
  const marker='NLMARK'+Math.random().toString(36).slice(2)+'X';
  const protect=html=>{const i=protectedParts.push(html)-1;return marker+i+'END';};
  text=text.replace(/`([^`\n]+)`/g,(_,code)=>protect('<code>'+code+'</code>'));
  text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/gi,(_,label,url)=>protect('<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>'));
  text=text.replace(/\*\*(.+?)\*\*|__(.+?)__/g,(_,a,b)=>'<strong>'+(a||b)+'</strong>');
  text=text.replace(/~~(.+?)~~/g,'<del>$1</del>');
  text=text.replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;])/g,'$1<em>$2</em>');
  text=text.replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?:;])/g,'$1<em>$2</em>');
  text=text.replace(/\n/g,'<br>');
  return text.replace(new RegExp(marker+'(\\d+)END','g'),(_,i)=>protectedParts[Number(i)]||'');
}
function nlinkMarkdownToHtml(markdown) {
  const lines=String(markdown).replace(/\r/g,'').split('\n');
  const out=[]; let paragraph=[]; let listType=''; let code=false; let codeLines=[];
  const flushParagraph=()=>{if(paragraph.length){out.push('<p>'+nlinkInlineMarkdown(paragraph.join(' '))+'</p>');paragraph=[];}};
  const flushList=()=>{if(listType){out.push('</'+listType+'>');listType='';}};
  for(const line of lines){
    if(/^\s*```/.test(line)){
      if(code){out.push('<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>');codeLines=[];code=false;}
      else{flushParagraph();flushList();code=true;}
      continue;
    }
    if(code){codeLines.push(line);continue;}
    if(!line.trim()){flushParagraph();flushList();continue;}
    const heading=line.match(/^\s*(#{1,3})\s+(.+)$/);
    if(heading){flushParagraph();flushList();const level=heading[1].length;out.push('<h'+level+'>'+nlinkInlineMarkdown(heading[2])+'</h'+level+'>');continue;}
    const bullet=line.match(/^\s*[-*+]\s+(.+)$/);
    const numbered=line.match(/^\s*\d+[.)]\s+(.+)$/);
    if(bullet||numbered){flushParagraph();const nextType=bullet?'ul':'ol';if(listType!==nextType){flushList();listType=nextType;out.push('<'+listType+'>');}out.push('<li>'+nlinkInlineMarkdown((bullet||numbered)[1])+'</li>');continue;}
    const quote=line.match(/^\s*>\s?(.*)$/);
    if(quote){flushParagraph();flushList();out.push('<blockquote>'+nlinkInlineMarkdown(quote[1])+'</blockquote>');continue;}
    if(/^\s*(?:---+|___+|\*\*\*+)\s*$/.test(line)){flushParagraph();flushList();out.push('<hr>');continue;}
    flushList();paragraph.push(line);
  }
  if(code)out.push('<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>');
  flushParagraph();flushList();
  return out.join('');
}
function nlinkAddMessage(role,text,extra='') {
  const el=document.createElement('div');
  el.className='nlink-msg '+role+(extra?' '+extra:'');
  if(role==='assistant'&&!['pending','error'].includes(extra)) el.innerHTML=nlinkMarkdownToHtml(text);
  else el.textContent=text;
  nlinkMessages.appendChild(el);
  nlinkMessages.scrollTop=nlinkMessages.scrollHeight;
  return el;
}
function nlinkRenderChat() {
  nlinkMessages.replaceChildren();
  const page=cur();
  document.getElementById('nlink-ai-context').textContent='Using note: '+(page.title||'Untitled');
  const messages=nlinkHistory();
  if(!messages.length) {
    const empty=document.createElement('div'); empty.className='nlink-empty';
    empty.textContent='Ask a question about “'+(page.title||'Untitled')+'”. Nlink AI will use the text in this open note as context.';
    nlinkMessages.appendChild(empty); return;
  }
  messages.forEach(m=>nlinkAddMessage(m.role,m.content));
}
function syncNlinkChatPage() {
  if(nlinkPanel && nlinkPanel.classList.contains('open')) nlinkRenderChat();
}
function nlinkOpen() {
  nlinkPanel.classList.add('open'); nlinkPanel.setAttribute('aria-hidden','false');
  nlinkFab.setAttribute('aria-expanded','true'); nlinkRenderChat(); nlinkInput.focus();
}
function nlinkClose() {
  nlinkPanel.classList.remove('open'); nlinkPanel.setAttribute('aria-hidden','true');
  nlinkFab.setAttribute('aria-expanded','false'); nlinkFab.focus();
}
function nlinkNoteContext() {
  const page=cur();
  const content=page.blocks.map(b=>{
    const text=plainText(b.html||'').trim();
    if(!text && b.type!=='divider') return '';
    const label={h1:'#',h2:'##',h3:'###',bullet:'•',numbered:'1.',todo:'[ ]',quote:'Quote:',callout:'Note:',code:'Code:'}[b.type]||'';
    return [label,text].filter(Boolean).join(' ');
  }).filter(Boolean).join('\n');
  const maxChars=14000;
  return {title:page.title||'Untitled',text:content.length>maxChars?content.slice(0,maxChars)+'\n[Note excerpt shortened to fit the request.]':content};
}
async function nlinkSubmit(event) {
  event.preventDefault();
  const question=nlinkInput.value.trim();
  if(!question || nlinkSend.disabled) return;
  const chatKey=nlinkChatKey();
  const messages=nlinkHistory();
  const note=nlinkNoteContext();
  nlinkMessages.querySelector('.nlink-empty')?.remove();
  nlinkAddMessage('user',question);
  messages.push({role:'user',content:question});
  if(messages.length>24) messages.splice(0,messages.length-24);
  nlinkInput.value=''; nlinkInput.style.height='auto'; nlinkSend.disabled=true;
  const pending=nlinkAddMessage('assistant','Thinking…','pending');
  const notePrompt='Current note title: '+note.title+'\n\nCurrent note text:\n'+(note.text||'(The note has no text yet.)');
  try {
    const response=await fetch(NLINK_AI_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+NLINK_AI_ANON_KEY},
      body:JSON.stringify({messages:[
        {role:'system',content:NLINK_AI_SYSTEM+'\n\n'+notePrompt},
        ...messages.slice(-12)
      ]})
    });
    if(!response.ok) throw new Error('AI request failed ('+response.status+')');
    const data=await response.json();
    const answer=String(data.choices?.[0]?.message?.content||'I could not generate a response.');
    pending.remove();
    if(nlinkChats.get(chatKey)===messages) {
      messages.push({role:'assistant',content:answer});
      if(messages.length>24) messages.splice(0,messages.length-24);
      if(nlinkChatKey()===chatKey) nlinkAddMessage('assistant',answer);
    }
  } catch(error) {
    pending.remove();
    if(nlinkChats.get(chatKey)===messages) {
      messages.pop();
      if(nlinkChatKey()===chatKey) nlinkAddMessage('assistant','Nlink AI could not be reached. Please check your connection and try again.','error');
    }
    console.warn('[Nlink AI]',error);
  } finally { nlinkSend.disabled=false; nlinkInput.focus(); }
}
