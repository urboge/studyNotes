<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyNotes</title>
<script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
<style>
:root{
  --bg:#ffffff; --bg-side:#f7f7f5; --hover:rgba(55,53,47,.08);
  --text:#37352f; --muted:#787774; --faint:#b4b4b0; --border:#e9e9e7; --accent:#2383e2;
  --callout:#f1f1ef; --code:#f7f6f3; --inline-code:#eb5757; --bulb:#d9a400;
  --scroll:rgba(55,53,47,.16); --scroll-hover:rgba(55,53,47,.32); --select:rgba(35,131,226,.14);
  /* Notion palette: text colors (--c-*) and background/highlight colors (--b-*) */
  --c-gray:#787774; --c-brown:#9f6b53; --c-orange:#d9730d; --c-yellow:#cb912f; --c-green:#448361;
  --c-blue:#337ea9; --c-purple:#9065b0; --c-pink:#c14c8a; --c-red:#d44c47;
  --b-gray:#f1f1ef; --b-brown:#f4eeee; --b-orange:#fbecdd; --b-yellow:#fbf3db; --b-green:#edf3ec;
  --b-blue:#e7f3f8; --b-purple:#f6f3f9; --b-pink:#faf1f5; --b-red:#fdebec;
  --shadow:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
}
[data-theme="dark"]{
  --bg:#191919; --bg-side:#202020; --hover:rgba(255,255,255,.07);
  --text:#e6e6e4; --muted:#9b9b98; --faint:#5a5a58; --border:#2f2f2f;
  --callout:#262626; --code:#262626; --inline-code:#ff7b72; --bulb:#f2c94c;
  --scroll:rgba(255,255,255,.14); --scroll-hover:rgba(255,255,255,.3); --select:rgba(35,131,226,.22);
  --c-gray:#9b9b9b; --c-brown:#ba856f; --c-orange:#c77d48; --c-yellow:#ca9849; --c-green:#529e72;
  --c-blue:#379ad3; --c-purple:#9d68d3; --c-pink:#d15796; --c-red:#df5452;
  --b-gray:#2f2f2f; --b-brown:#4a3228; --b-orange:#5c3b23; --b-yellow:#564328; --b-green:#243d30;
  --b-blue:#143a4e; --b-purple:#3c2d49; --b-pink:#4e2c3c; --b-red:#522e2a;
  --shadow:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.35),0 9px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden;font-size:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

/* ---------- Custom scrollbars (page, sidebar, menus, text boxes) ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:3px solid transparent;background-clip:padding-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover);border:3px solid transparent;background-clip:padding-box}
.menu::-webkit-scrollbar,#pageList::-webkit-scrollbar,textarea::-webkit-scrollbar{width:8px}
.menu::-webkit-scrollbar-thumb,#pageList::-webkit-scrollbar-thumb,textarea::-webkit-scrollbar-thumb{border-width:2px}
#pageList::-webkit-scrollbar-thumb{background:transparent}
#pageList:hover::-webkit-scrollbar-thumb{background:var(--scroll);background-clip:padding-box}
@supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent} }

/* ---------- Icons ---------- */
ion-icon{flex-shrink:0;pointer-events:none}

/* ---------- Sidebar ---------- */
#sidebar{width:260px;flex-shrink:0;background:var(--bg-side);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;transition:margin-left .2s}
body.side-toggled #sidebar{margin-left:-261px}
.side-head{padding:14px 14px 8px;display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.logo{width:24px;height:24px;border-radius:6px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700}
.search-wrap{position:relative;margin:4px 10px 6px;display:flex}
.search-wrap ion-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--muted)}
#search{flex:1;min-width:0;padding:6px 10px 6px 30px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:14px;outline:none}
#search:focus{border-color:var(--accent)}
.side-label{padding:12px 14px 4px;font-size:12px;color:var(--muted);font-weight:600}
#pageList{flex:1;overflow-y:auto;padding:0 6px}
.page-item{display:flex;align-items:center;gap:6px;padding:4px 6px 4px calc(4px + var(--depth,0) * 14px);border-radius:6px;cursor:pointer;font-size:14px;min-height:30px}
.pi-caret{width:20px;height:20px;flex-shrink:0;border-radius:4px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.pi-caret:hover{background:var(--hover)}
.pi-caret ion-icon{transition:transform .15s ease}
.page-item.expanded .pi-caret ion-icon{transform:rotate(90deg)}
.pi-btn{opacity:0;color:var(--muted);width:20px;height:20px;border-radius:4px;font-size:14px;display:grid;place-items:center;flex-shrink:0}
.page-item:hover .pi-btn{opacity:1}
.pi-btn:hover{background:var(--hover);color:var(--text)}
.page-item:hover{background:var(--hover)}
.page-item.active{background:var(--hover);font-weight:600}
.pi-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-item > ion-icon{font-size:17px;color:var(--muted)}
.page-item.active > ion-icon{color:var(--text)}
.pi-del:hover{color:#e03e3e}
.side-empty{padding:6px 10px;font-size:13px;color:var(--muted)}
.side-btn{display:flex;align-items:center;gap:8px;width:calc(100% - 12px);margin:1px 6px;padding:5px 8px;border-radius:6px;font-size:14px;color:var(--muted);text-align:left}
.side-btn:hover{background:var(--hover);color:var(--text)}
.side-btn ion-icon{font-size:16px}
.side-foot{border-top:1px solid var(--border);padding:4px 0 10px}

/* ---------- Main ---------- */
#main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
.topbar{height:44px;display:flex;align-items:center;gap:4px;padding:0 10px;flex-shrink:0}
#crumb{flex:1;min-width:0;font-size:14px;display:flex;align-items:center;gap:6px;padding-left:4px}
#crumb{gap:2px;overflow:hidden}
#crumb ion-icon{font-size:16px;color:var(--muted)}
.crumb-seg{display:flex;align-items:center;gap:6px;min-width:0;padding:3px 6px;border-radius:5px;color:var(--text)}
.crumb-seg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.crumb-seg.link{cursor:pointer;color:var(--muted)}
.crumb-seg.link:hover{background:var(--hover);color:var(--text)}
.crumb-sep{color:var(--faint);padding:0 1px}
#status{font-size:12px;color:var(--muted);margin-right:6px;white-space:nowrap}
.tb-btn{height:28px;min-width:28px;padding:0 7px;border-radius:6px;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tb-btn ion-icon{font-size:18px}
.tb-btn:hover{background:var(--hover);color:var(--text)}
#scroller{flex:1;overflow-y:auto}
.page{max-width:760px;margin:0 auto;padding:56px 64px 0}
#pageIcon{font-size:56px;line-height:1;cursor:pointer;border-radius:8px;padding:6px;display:inline-flex;user-select:none;color:var(--text)}
#pageIcon:hover{background:var(--hover)}
#pageTitle{font-size:40px;font-weight:700;outline:none;margin:8px 0 6px;line-height:1.2;word-break:break-word}
#pageTitle:empty:before{content:"Untitled";color:var(--faint)}
#meta{font-size:13px;color:var(--muted);margin-bottom:22px}
#tail{height:35vh;cursor:text}

/* ---------- Blocks ---------- */
.block{position:relative;display:flex;margin:1px 0}
.gutter{position:absolute;left:-50px;top:0;display:flex;gap:1px;opacity:0;transition:opacity .1s;padding-top:3px}
.block:hover .gutter{opacity:1}
.gutter button{width:22px;height:24px;border-radius:4px;color:var(--faint);font-size:18px;display:grid;place-items:center}
.gutter button:hover{background:var(--hover);color:var(--muted)}
.gutter .drag{cursor:grab}
.body{flex:1;min-width:0;display:flex;align-items:flex-start;gap:4px;padding:3px 2px;border-radius:4px}
.content{flex:1;min-width:0;outline:none;line-height:1.55;word-break:break-word;white-space:pre-wrap;min-height:1.55em}
.content:empty:before{content:attr(data-placeholder);color:var(--faint);pointer-events:none}
.block[data-type="text"] .content:empty:not(:focus):before{content:""}
.content code{background:var(--code);color:var(--inline-code);padding:1px 5px;border-radius:4px;font-size:85%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.content a{color:inherit;text-decoration:underline;text-decoration-color:var(--faint)}

.block[data-type="h1"]{margin-top:26px}
.block[data-type="h1"] .content{font-size:30px;font-weight:700;line-height:1.3}
.block[data-type="h1"] .gutter{padding-top:10px}
.block[data-type="h2"]{margin-top:20px}
.block[data-type="h2"] .content{font-size:24px;font-weight:650;line-height:1.3}
.block[data-type="h2"] .gutter{padding-top:7px}
.block[data-type="h3"]{margin-top:14px}
.block[data-type="h3"] .content{font-size:20px;font-weight:600;line-height:1.3}
.block[data-type="h3"] .gutter{padding-top:4px}

.marker{width:22px;flex-shrink:0;text-align:center;line-height:1.55;user-select:none}
.block[data-type="numbered"] .marker{width:auto;min-width:22px;padding-right:2px}
.check{width:16px;height:16px;margin:4px 6px 0 3px;border:1.5px solid var(--muted);border-radius:3px;flex-shrink:0;cursor:pointer;display:grid;place-items:center}
.block.checked .check{background:var(--accent);border-color:var(--accent)}
.block.checked .check:after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.block.checked .content{text-decoration:line-through;color:var(--muted)}

.block[data-type="quote"] .body{border-left:3px solid var(--text);border-radius:0;padding-left:14px;margin:4px 0}
.block[data-type="quote"] .content{font-size:17px}
.block[data-type="callout"] .body{background:var(--callout);padding:14px 16px 14px 12px;border-radius:6px;margin:4px 0;gap:10px}
.block[data-type="callout"] .gutter{padding-top:14px}
.callout-icon{font-size:20px;display:flex;padding-top:2px;color:var(--bulb);user-select:none}
.block[data-type="code"] .body{background:var(--code);padding:14px 16px;border-radius:6px;margin:4px 0}
.block[data-type="code"] .gutter{padding-top:12px}
.block[data-type="code"] .content{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;tab-size:2}
.block[data-type="divider"] .body{padding:11px 2px}
.block[data-type="divider"] .gutter{padding-top:0}
hr{border:0;border-top:1px solid var(--border);width:100%;margin:0}

.block.dragging{opacity:.4}
.block.drop-before:before,.block.drop-after:after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--accent);opacity:.7;border-radius:2px}
.block.drop-before:before{top:-2px}
.block.drop-after:after{bottom:-2px}

/* ---------- Menus ---------- */
.menu{position:fixed;z-index:50;background:var(--bg);border-radius:8px;box-shadow:var(--shadow);width:300px;max-height:340px;overflow-y:auto;padding:6px 0;display:none}
.menu.open{display:block}
.menu-section{font-size:11px;color:var(--muted);font-weight:600;padding:8px 14px 4px}
.menu-item{display:flex;align-items:center;gap:10px;padding:4px 10px;margin:0 4px;border-radius:5px;cursor:pointer}
.menu-item.active{background:var(--hover)}
.mi-icon{width:42px;height:42px;border:1px solid var(--border);border-radius:5px;display:grid;place-items:center;font-size:15px;font-weight:600;background:var(--bg);flex-shrink:0}
.mi-icon ion-icon{font-size:20px}
.menu.compact .mi-icon ion-icon{font-size:16px;color:var(--muted)}
.mi-label{font-size:14px}
.mi-desc{font-size:12px;color:var(--muted)}
.mi-key{margin-left:auto;font-size:11px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
.menu-empty{padding:6px 14px;color:var(--muted);font-size:14px}
.menu.compact{width:240px}
.menu.compact .mi-icon{width:22px;height:22px;border:0;font-size:14px;background:none}
.menu.compact .menu-item{padding:5px 10px}

#emojiPop{position:fixed;z-index:50;background:var(--bg);border-radius:8px;box-shadow:var(--shadow);padding:8px;display:none;grid-template-columns:repeat(8,34px);gap:2px}
#emojiPop.open{display:grid}
#emojiPop button{width:34px;height:34px;border-radius:5px;font-size:20px;display:grid;place-items:center;color:var(--muted)}
#emojiPop button:hover,#emojiPop button.active{background:var(--hover);color:var(--text)}

#scrim{display:none}

/* ---------- Modal (share / import) ---------- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:none;place-items:center}
#modal.open{display:grid}
.modal-box{background:var(--bg);color:var(--text);border-radius:10px;box-shadow:var(--shadow);width:min(480px,calc(100vw - 32px));padding:20px}
.modal-box h3{margin:0 0 10px;font-size:17px}
.modal-box p{margin:0 0 10px;font-size:14px;color:var(--muted);line-height:1.5}
.modal-box p.warn{color:#d9730d}
.modal-box p ion-icon{vertical-align:-3px;font-size:16px}
.modal-box textarea{width:100%;height:92px;resize:none;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--code);color:var(--text);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;outline:none}
.share-preview{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;font-weight:600}
.share-preview ion-icon{font-size:26px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{padding:6px 14px;border-radius:6px;font-size:14px;border:1px solid var(--border);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}

/* ---------- Inline colors & block colors (rules per color are generated in JS) ---------- */
.content [data-bg]{border-radius:3px;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.block[data-bg] .body{padding-left:6px;padding-right:6px}

/* ---------- Nesting & toggle lists ---------- */
.block{margin-left:calc(var(--indent,0) * 26px)}
.toggle-btn{width:22px;height:24px;flex-shrink:0;border-radius:4px;display:grid;place-items:center;font-size:12px;color:var(--text)}
.toggle-btn:hover{background:var(--hover)}
.toggle-btn ion-icon{transition:transform .15s ease}
.block.open > .body .toggle-btn ion-icon{transform:rotate(90deg)}
.toggle-empty{margin-left:calc(var(--indent,0) * 26px);padding:3px 2px 3px 4px;line-height:1.55;color:var(--faint);cursor:pointer;border-radius:4px}
.toggle-empty:hover{background:var(--hover);color:var(--muted)}

/* ---------- Page blocks (sub-pages) ---------- */
.page-link{display:flex;align-items:center;gap:7px;width:100%;padding:1px 2px;border-radius:4px;cursor:pointer;color:var(--text);text-decoration:none;line-height:1.55}
.page-link:hover{background:var(--hover)}
.page-link ion-icon{font-size:19px;color:var(--muted)}
.pl-title{font-weight:500;border-bottom:1px solid var(--border);line-height:1.3}

/* ---------- Block selection ---------- */
.block.selected .body{box-shadow:inset 0 0 0 9999px var(--select)}
#marquee{position:fixed;z-index:20;display:none;pointer-events:none;background:var(--select);border:1px solid rgba(35,131,226,.45);border-radius:2px}
body.marquee-on{user-select:none;cursor:default}

/* ---------- Selection toolbar ---------- */
#toolbar{position:fixed;z-index:45;display:none;align-items:center;height:36px;padding:3px;background:var(--bg);border-radius:8px;box-shadow:var(--shadow);user-select:none}
#toolbar.open{display:flex}
#toolbar button{height:28px;min-width:28px;padding:0 6px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;gap:3px;font-size:15px;color:var(--text)}
#toolbar button:hover{background:var(--hover)}
#toolbar button.on{color:var(--accent)}
#toolbar .sep{width:1px;height:20px;background:var(--border);margin:0 3px}
#toolbar ion-icon{font-size:16px}
#toolbar .chev{font-size:11px;color:var(--muted)}
#toolbar .tb-turn{font-size:14px;padding:0 8px}
#toolbar .tb-letter{font-family:Georgia,"Times New Roman",serif;font-size:16px;width:28px}
.color-a{font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}

#colorPanel{position:fixed;z-index:55;display:none;width:220px;max-height:380px;overflow-y:auto;padding:6px 0;background:var(--bg);border-radius:8px;box-shadow:var(--shadow)}
#colorPanel.open{display:block}
#colorPanel::-webkit-scrollbar{width:8px}
#colorPanel::-webkit-scrollbar-thumb{border-width:2px}
.cp-item{display:flex;align-items:center;gap:10px;padding:4px 10px;margin:0 4px;border-radius:5px;cursor:pointer;font-size:14px}
.cp-item:hover,.cp-item.active{background:var(--hover)}
.sw{width:22px;height:22px;border:1px solid var(--border);border-radius:4px;display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}

/* ---------- Mobile ---------- */
@media (max-width:800px){
  #sidebar{position:fixed;z-index:40;left:0;top:0;margin-left:-270px;box-shadow:var(--shadow)}
  body.side-toggled #sidebar{margin-left:0}
  body.side-toggled #scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.25)}
  .page{padding:28px 22px 0}
  .gutter{display:none}
  #pageTitle{font-size:32px}
  #pageIcon{font-size:48px}
}

/* ---------- Nlink AI note assistant ---------- */
#nlink-ai-fab{position:fixed;right:24px;bottom:24px;z-index:70;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.22);transition:transform .15s,filter .15s}
#nlink-ai-fab:hover{transform:translateY(-2px);filter:brightness(1.08)}
#nlink-ai-fab ion-icon{font-size:25px}
#nlink-ai-panel{position:fixed;right:24px;bottom:92px;z-index:70;width:min(380px,calc(100vw - 32px));height:min(560px,calc(100dvh - 120px));min-height:300px;display:none;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
#nlink-ai-panel.open{display:flex}
:root{--nlink-control-bg:#f0f0ef;--nlink-control-fg:#37352f;--nlink-user-bg:#f1f1ef;--nlink-user-fg:#37352f;--nlink-focus:#85847f}
[data-theme="dark"]{--nlink-control-bg:#353535;--nlink-control-fg:#ececea;--nlink-user-bg:#303030;--nlink-user-fg:#e6e6e4;--nlink-focus:#8b8b88}
#nlink-ai-fab{background:var(--nlink-control-bg);color:var(--nlink-control-fg);border:1px solid var(--border);box-shadow:0 5px 20px rgba(0,0,0,.16)}
#nlink-ai-panel{border-radius:20px}
.nlink-head{border-radius:20px 20px 0 0}
.nlink-mark{background:var(--nlink-control-bg);color:var(--nlink-control-fg);border:1px solid var(--border)}
.nlink-head button{border-radius:10px}
#nlink-ai-input{border-radius:14px}
.nlink-head{height:54px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border)}
.nlink-mark{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:white}
.nlink-mark ion-icon{font-size:18px}
.nlink-head-copy{flex:1;min-width:0}
.nlink-title{font-size:14px;font-weight:650}
.nlink-context{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.nlink-head button{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.nlink-head button:hover{background:var(--hover);color:var(--text)}
.nlink-head button ion-icon{font-size:18px}
#nlink-ai-messages{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.nlink-msg{max-width:88%;padding:10px 13px;border-radius:18px;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.nlink-msg p{margin:0 0 7px}.nlink-msg p:last-child{margin-bottom:0}
.nlink-msg ul,.nlink-msg ol{margin:5px 0 7px;padding-left:20px}.nlink-msg li{padding-left:2px;margin:3px 0}
.nlink-msg h1,.nlink-msg h2,.nlink-msg h3{font-size:1em;line-height:1.4;margin:8px 0 4px}.nlink-msg h1:first-child,.nlink-msg h2:first-child,.nlink-msg h3:first-child{margin-top:0}
.nlink-msg blockquote{margin:6px 0;padding:2px 0 2px 10px;border-left:2px solid var(--faint);color:var(--muted)}
.nlink-msg code{padding:1px 4px;border-radius:5px;background:var(--code);font: .92em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.nlink-msg pre{margin:6px 0;padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--code);overflow:auto;white-space:pre}
.nlink-msg pre code{padding:0;background:none}.nlink-msg a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.nlink-msg.assistant{align-self:flex-start;background:var(--callout);border-bottom-left-radius:7px}
.nlink-msg.user{align-self:flex-end;background:var(--nlink-user-bg);color:var(--nlink-user-fg);border:1px solid var(--border);border-bottom-right-radius:7px}
.nlink-msg.pending{color:var(--muted);font-style:italic}
.nlink-msg.error{color:#d44c47}
.nlink-empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;line-height:1.55;padding:12px}
#nlink-ai-form{flex-shrink:0;display:flex;align-items:flex-end;gap:8px;padding:10px;border-top:1px solid var(--border)}
#nlink-ai-input{flex:1;min-width:0;max-height:100px;resize:none;border:1px solid var(--border);border-radius:10px;padding:9px 10px;background:var(--bg);color:var(--text);font-family:inherit;font-size:13px;line-height:1.4;outline:none}
#nlink-ai-input:focus{border-color:var(--nlink-focus)}
#nlink-ai-input::placeholder{color:var(--faint)}
#nlink-ai-send{width:38px;height:38px;flex-shrink:0;border:1px solid var(--border);border-radius:13px;display:grid;place-items:center;background:var(--nlink-control-bg);color:var(--nlink-control-fg);transition:filter .15s,transform .15s}
#nlink-ai-send:hover:not(:disabled){filter:brightness(.96);transform:translateY(-1px)}
#nlink-ai-send:disabled{opacity:.45;cursor:wait}
#nlink-ai-send ion-icon{font-size:18px}
@media(max-width:480px){
  #nlink-ai-fab{right:16px;bottom:16px;width:52px;height:52px}
  #nlink-ai-panel{right:12px;bottom:78px;width:calc(100vw - 24px);height:min(560px,calc(100dvh - 100px))}
}

<body>

<aside id="sidebar">
  <div class="side-head"><div class="logo">S</div>StudyNotes</div>
  <div class="search-wrap"><ion-icon name="search-outline"></ion-icon><input id="search" placeholder="Search pages…" autocomplete="off"></div>
  <div class="side-label">Pages</div>
  <div id="pageList"></div>
  <div class="side-foot">
    <button class="side-btn" id="newPageBtn"><ion-icon name="add-outline"></ion-icon>New page</button>
    <div class="side-label">Templates</div>
    <button class="side-btn" data-template="lecture"><ion-icon name="create-outline"></ion-icon>Lecture notes</button>
    <button class="side-btn" data-template="assignment"><ion-icon name="clipboard-outline"></ion-icon>Assignment</button>
    <button class="side-btn" data-template="week"><ion-icon name="calendar-outline"></ion-icon>Weekly planner</button>
  </div>
</aside>
<div id="scrim"></div>

<main id="main">
  <div class="topbar">
    <button class="tb-btn" id="menuToggle" title="Toggle sidebar"><ion-icon name="menu-outline"></ion-icon></button>
    <div id="crumb"></div>
    <span id="status"></span>
    <button class="tb-btn" id="shareBtn" title="Create a share link for this page"><ion-icon name="share-social-outline"></ion-icon>Share</button>
    <button class="tb-btn" id="themeBtn" title="Toggle dark mode"><ion-icon name="moon-outline"></ion-icon></button>
    <button class="tb-btn" id="moreBtn" title="More"><ion-icon name="ellipsis-horizontal"></ion-icon></button>
  </div>
  <div id="scroller">
    <div class="page">
      <span id="pageIcon" title="Change icon"></span>
      <div id="pageTitle" contenteditable="true" spellcheck="true"></div>
      <div id="meta"></div>
      <div id="blocks"></div>
      <div id="tail"></div>
    </div>
  </div>
</main>

<div class="menu" id="menu"></div>
<div id="emojiPop"></div>
<div id="modal"><div class="modal-box"></div></div>
<div id="marquee"></div>
<div id="toolbar">
  <button data-act="turn" class="tb-turn" title="Turn into"><span id="turnLabel">Text</span><ion-icon class="chev" name="chevron-down-outline"></ion-icon></button>
  <span class="sep"></span>
  <button data-act="link" title="Link (Ctrl+K)"><ion-icon name="link-outline"></ion-icon></button>
  <span class="sep"></span>
  <button data-cmd="bold" class="tb-letter" title="Bold (Ctrl+B)"><b>B</b></button>
  <button data-cmd="italic" class="tb-letter" title="Italic (Ctrl+I)"><i>i</i></button>
  <button data-cmd="underline" class="tb-letter" title="Underline (Ctrl+U)"><u>U</u></button>
  <button data-cmd="strikeThrough" class="tb-letter" title="Strikethrough"><s>S</s></button>
  <button data-act="code" title="Inline code"><ion-icon name="code-slash-outline"></ion-icon></button>
  <span class="sep"></span>
  <button data-act="color" title="Text color & highlight (Ctrl+Shift+H = last used)"><span class="color-a" id="colorA">A</span><ion-icon class="chev" name="chevron-down-outline"></ion-icon></button>
</div>
<div id="colorPanel"></div>

<div id="nlink-ai-panel" role="region" aria-label="Nlink AI note chat" aria-hidden="true">
  <div class="nlink-head">
    <div class="nlink-mark"><ion-icon name="sparkles-outline"></ion-icon></div>
    <div class="nlink-head-copy"><div class="nlink-title">Nlink AI</div><div class="nlink-context" id="nlink-ai-context">Ask about this note</div></div>
    <button type="button" id="nlink-ai-clear" title="Clear this chat" aria-label="Clear this chat"><ion-icon name="trash-outline"></ion-icon></button>
    <button type="button" id="nlink-ai-close" title="Close chat" aria-label="Close chat"><ion-icon name="close-outline"></ion-icon></button>
  </div>
  <div id="nlink-ai-messages" aria-live="polite"></div>
  <form id="nlink-ai-form">
    <textarea id="nlink-ai-input" rows="1" maxlength="4000" aria-label="Ask Nlink AI about this note" placeholder="Ask about this note…"></textarea>
    <button id="nlink-ai-send" type="submit" aria-label="Send question"><ion-icon name="send-outline"></ion-icon></button>
  </form>
</div>
<button id="nlink-ai-fab" type="button" aria-label="Open Nlink AI" aria-expanded="false" aria-controls="nlink-ai-panel" title="Ask Nlink AI about this note"><ion-icon name="sparkles-outline"></ion-icon></button>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
/* ================= Config ================= */
const STORE = 'studynotes.v1';
const TYPES = [
  // icon: "i:<name>" = Ionicon, anything else = short text label (Ionicons has no heading/number glyphs)
  {type:'text',     label:'Text',          desc:'Plain paragraph',            icon:'i:text-outline',             md:'',    keys:'text paragraph plain p'},
  {type:'h1',       label:'Heading 1',     desc:'Big section heading',        icon:'H1',                         md:'#',   keys:'h1 heading1 title big'},
  {type:'h2',       label:'Heading 2',     desc:'Medium section heading',     icon:'H2',                         md:'##',  keys:'h2 heading2 subtitle'},
  {type:'h3',       label:'Heading 3',     desc:'Small section heading',      icon:'H3',                         md:'###', keys:'h3 heading3 small'},
  {type:'bullet',   label:'Bulleted list', desc:'Simple bullet points',       icon:'i:list-outline',             md:'-',   keys:'bullet bullets list ul unordered'},
  {type:'numbered', label:'Numbered list', desc:'List with numbers',          icon:'1.',                         md:'1.',  keys:'numbered number list ol ordered'},
  {type:'todo',     label:'To-do list',    desc:'Track tasks with checkboxes',icon:'i:checkbox-outline',         md:'[]',  keys:'todo to-do task checkbox check'},
  {type:'toggle',   label:'Toggle list',   desc:'Show or hide content inside',icon:'i:caret-forward-outline',    md:'>',   keys:'toggle collapse expand fold details dropdown'},
  {type:'quote',    label:'Quote',         desc:'Capture a quote',            icon:'i:chatbox-ellipses-outline', md:'"',   keys:'quote blockquote citation'},
  {type:'callout',  label:'Callout',       desc:'Highlight key information',  icon:'i:bulb-outline',             md:'',    keys:'callout note tip info highlight important'},
  {type:'code',     label:'Code',          desc:'Code snippet or formula',    icon:'i:code-slash-outline',       md:'```', keys:'code snippet pre program'},
  {type:'page',     label:'Page',          desc:'Create a page inside this page', icon:'i:document-text-outline', md:'',    keys:'page subpage sub-page new document'},
  {type:'divider',  label:'Divider',       desc:'Separate sections',          icon:'i:remove-outline',           md:'---', keys:'divider line hr separator'},
];
const PLACEHOLDER = {text:"Type '/' for commands",h1:'Heading 1',h2:'Heading 2',h3:'Heading 3',bullet:'List',numbered:'List',
  todo:'To-do',toggle:'Toggle',quote:'Empty quote',callout:'Type something…',code:'Code — Enter: new line, Ctrl+Enter: exit'};
const LIST_TYPES = ['bullet','numbered','todo'];
const COLORS = ['gray','brown','orange','yellow','green','blue','purple','pink','red'];
const COLOR_RE = new RegExp('^(bg:)?(' + COLORS.join('|') + ')$');
(function colorCss(){ // one rule set per palette color: inline spans + whole-block colors
  const st=document.createElement('style');
  st.textContent = COLORS.map(c=>
    `.content [data-c="${c}"],.block[data-tc="${c}"] .content{color:var(--c-${c})}` +
    `.content [data-bg="${c}"]{background:var(--b-${c})}` +
    `.block[data-bg="${c}"] .body{background:var(--b-${c})}`).join('\n');
  document.head.appendChild(st);
})();
const MD_SHORTCUTS = {'# ':'h1','## ':'h2','### ':'h3','- ':'bullet','* ':'bullet','1. ':'numbered','[] ':'todo','[ ] ':'todo','> ':'toggle','" ':'quote','“ ':'quote','---':'divider','```':'code'};
const PAGE_ICONS = ['document-text','create','clipboard','library','book','school','bulb','flask','calculator','bar-chart','folder','calendar',
  'checkmark-circle','star','flag','rocket','laptop','earth','color-palette','musical-notes','football','heart','chatbubbles','pencil',
  'pin','bookmark','business','leaf','language','telescope','fitness','hand-left'].map(n=>n+'-outline');
const DEFAULT_ICON = 'document-text-outline';
// Pages saved by the earlier emoji version get the matching icon
const LEGACY_ICONS = {'👋':'hand-left','📝':'create','🎯':'clipboard','📅':'calendar','📄':'document-text','📚':'library','📖':'book','🎓':'school',
  '💡':'bulb','🧪':'flask','🔬':'flask','🧮':'calculator','📊':'bar-chart','🗂️':'folder','✅':'checkmark-circle','⭐':'star','🚀':'rocket',
  '💻':'laptop','🌍':'earth','🎨':'color-palette','🎵':'musical-notes','⚽':'football','❤️':'heart','✏️':'pencil','📌':'pin','🔖':'bookmark',
  '🏛️':'business','🌱':'leaf','🗣️':'chatbubbles'};
const pageIcon = v => PAGE_ICONS.includes(v) ? v : (LEGACY_ICONS[v] ? LEGACY_ICONS[v]+'-outline' : DEFAULT_ICON);

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const ic = name => `<ion-icon name="${String(name).replace(/[^a-z0-9-]/g,'')}"></ion-icon>`;
const iconHtml = v => v.startsWith('i:') ? ic(v.slice(2)) : esc(v);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newBlock = (type='text', html='', extra={}) => ({id:uid(), type, html, checked:false, indent:0, open:true, ...extra});
function stripText(html){ const d=document.createElement('div'); d.innerHTML=html; return d.textContent; }
function plainText(html){ const d=document.createElement('div'); d.innerHTML=html.replace(/<br\s*\/?>/gi,'\n'); return d.textContent.replace(/\n+$/,''); }
const isEmpty = b => !stripText(b.html).trim();

const ALLOWED = {B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,CODE:1,BR:1,A:1,MARK:1,SPAN:1};
function sanitize(html){
  const t=document.createElement('template'); t.innerHTML=String(html);
  (function walk(node){
    [...node.childNodes].forEach(n=>{
      if(n.nodeType===1){
        if(/^(SCRIPT|STYLE|IFRAME|OBJECT|TEMPLATE|SVG|MATH)$/i.test(n.tagName)){ n.remove(); return; }
        walk(n);
        if(!ALLOWED[n.tagName]) n.replaceWith(...n.childNodes);
        else{
          const href = n.tagName==='A' ? n.getAttribute('href') : null;
          const dc = n.getAttribute('data-c'), db = n.getAttribute('data-bg');
          [...n.attributes].forEach(a=>n.removeAttribute(a.name));
          if(href && /^https?:\/\//i.test(href)){ n.setAttribute('href',href); n.setAttribute('target','_blank'); n.setAttribute('rel','noopener'); }
          if(n.tagName==='SPAN'){   // spans are only kept for palette colors
            if(COLORS.includes(dc)) n.setAttribute('data-c',dc);
            if(COLORS.includes(db)) n.setAttribute('data-bg',db);
            if(!n.attributes.length) n.replaceWith(...n.childNodes);
          }
        }
      } else if(n.nodeType!==3) n.remove();
    });
  })(t.content);
  return t.innerHTML;
}

/* ================= State & storage ================= */
function cleanPage(p){
  p.id = p.id || uid();
  p.title = String(p.title || '');
  p.icon = pageIcon(String(p.icon || ''));
  p.parentId = typeof p.parentId==='string' && p.parentId ? p.parentId : null;   // sub-pages point to their parent
  p.expanded = !!p.expanded;                                                     // sidebar tree open/closed
  p.blocks = Array.isArray(p.blocks) ? p.blocks : [];
  p.blocks.forEach(b=>{
    if(b.type==='page') b.pageId = String(b.pageId||''); else delete b.pageId;
    b.id = b.id || uid();
    if(!TYPES.some(t=>t.type===b.type)) b.type='text';
    b.html = sanitize(b.html || '');
    b.checked = !!b.checked;
    b.color = COLOR_RE.test(b.color||'') ? b.color : '';
    b.indent = Math.max(0, Math.min(8, parseInt(b.indent,10) || 0));   // nesting level (children of toggles, nested lists)
    b.open = b.open !== false;                                         // toggles: open or closed
  });
  if(!p.blocks.length) p.blocks.push(newBlock());
  p.updated = p.updated || Date.now();
  return p;
}
function seed(){
  const b = newBlock;
  const p = {id:uid(), icon:'hand-left-outline', title:'Getting started', updated:Date.now(), blocks:[
    b('text','Welcome to <b>StudyNotes</b> — a simple notebook for your classes. Everything saves automatically in this browser.'),
    b('h2','The slash menu'),
    b('text','Click an empty line and type <code>/</code> to choose a block. Keep typing to filter: <code>/h2</code>, <code>/bullet</code>, <code>/todo</code>, <code>/quote</code>, <code>/code</code>…'),
    b('h2','Markdown shortcuts'),
    b('bullet','<code>#</code> <code>##</code> <code>###</code> + space → headings'),
    b('bullet','<code>-</code> + space → bullet list, <code>1.</code> + space → numbered list'),
    b('bullet','<code>[]</code> + space → to-do, <code>&gt;</code> + space → toggle list, <code>"</code> + space → quote, <code>---</code> → divider'),
    b('bullet','<b>Tab</b> / <b>Shift+Tab</b> → nest or un-nest a block'),
    b('toggle','What is a toggle list? Click the arrow',{open:false}),
    b('text','Toggles hide details until you need them — useful for definitions, exam questions and answers.',{indent:1}),
    b('h2','This week'),
    b('todo','Read chapter 3',{checked:true}),
    b('todo','Finish the math worksheet'),
    b('todo','Make flashcards for Friday\'s quiz'),
    b('callout','Hover a block and drag the handle on its left to move it. Click the handle to delete, duplicate or change its type.'),
    b('divider',''),
    b('text','Formatting: <b>Ctrl+B</b> bold, <i>Ctrl+I</i> italic, <u>Ctrl+U</u> underline. <b>Ctrl+K</b> turns selected text into a link (Ctrl+click opens it). <b>Shift+Enter</b> adds a line break inside a block.'),
    b('text','Select any text to make it <span data-c="red">red</span>, <span data-bg="yellow">highlight it</span> or change its style. Drag in the empty margin, or press <b>Esc</b> while typing, to select whole blocks.'),
    b('text','Click <b>Share</b> at the top to get a link that gives someone a copy of the page.'),
    b('text','Type <code>/page</code> to create a page inside this page — like this one:'),
  ]};
  const sub = {id:uid(), icon:'book-outline', title:'Example sub-page', parentId:p.id, updated:Date.now(), blocks:[
    b('text','This page lives inside <b>Getting started</b>. Use the path at the top or the sidebar to go back.'),
    b('text','Sharing this page sends only this page and the pages inside it — not the page around it.'),
  ]};
  p.blocks.push(b('page','',{pageId:sub.id}));
  p.expanded = true;
  return {pages:[p, sub], currentId:p.id, theme:'light'};
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE));
    if(d && Array.isArray(d.pages) && d.pages.length){ d.pages.forEach(cleanPage); validateTree(d.pages); return d; }
  }catch(e){}
  return seed();
}
function validateTree(pages){   // repair parents and page links so the page tree is always valid
  const byId=new Map(pages.map(p=>[p.id,p]));
  pages.forEach(p=>{
    if(p.parentId && !byId.has(p.parentId)) p.parentId=null;
    const seen=new Set([p.id]);   // break loops (A inside B inside A)
    for(let q=p.parentId && byId.get(p.parentId); q; q=q.parentId && byId.get(q.parentId)){
      if(seen.has(q.id)){ p.parentId=null; break; }
      seen.add(q.id);
    }
  });
  pages.forEach(p=>{
    p.blocks=p.blocks.filter(b=>b.type!=='page' || (byId.has(b.pageId) && b.pageId!==p.id));
    if(!p.blocks.length) p.blocks.push(newBlock());
  });
}
let state = load();
let selected = new Set(), selAnchor = null, selFocus = null;   // block selection
let clip = null;                                                 // blocks copied inside the app
state.recent = Array.isArray(state.recent) ? state.recent.filter(x=>/^(c|bg):[a-z]+$/.test(x)).slice(0,5) : [];
const cur = () => state.pages.find(p=>p.id===state.currentId) || (state.currentId = state.pages[0].id, state.pages[0]);
const blocks = () => cur().blocks;
const idx = id => blocks().findIndex(b=>b.id===id);
const getBlock = id => blocks().find(b=>b.id===id);

/* ----- Page tree helpers ----- */
const getPage = id => state.pages.find(p=>p.id===id);
const childrenOf = id => state.pages.filter(p=>(p.parentId||null)===id);
function collectTree(rootId){   // the page + every page inside it (any depth)
  const out=[], seen=new Set();
  (function walk(id){ const p=getPage(id); if(!p || seen.has(id)) return; seen.add(id); out.push(p); childrenOf(id).forEach(c=>walk(c.id)); })(rootId);
  return out;
}
function ancestors(p){
  const out=[], seen=new Set([p.id]);
  for(let q=p.parentId && getPage(p.parentId); q && !seen.has(q.id); q=q.parentId && getPage(q.parentId)){ seen.add(q.id); out.unshift(q); }
  return out;
}
function createSubpage(parent, title=''){
  const np=cleanPage({icon:DEFAULT_ICON, title, parentId:parent.id, blocks:[newBlock()]});
  state.pages.push(np); parent.expanded=true;
  return np;
}
function removePages(ids){   // delete pages and every link to them
  const gone=new Set(ids);
  state.pages=state.pages.filter(p=>!gone.has(p.id));
  state.pages.forEach(p=>{
    p.blocks=p.blocks.filter(b=>!(b.type==='page' && gone.has(b.pageId)));
    if(!p.blocks.length) p.blocks.push(newBlock());
  });
  if(!state.pages.length) state.pages.push(cleanPage({title:'', blocks:[]}));
}
const snapshotTree = id => JSON.parse(JSON.stringify(collectTree(id)));
function instantiateTree(list, parentId){   // add copies of a page tree with fresh ids; returns the new top page id
  const map=new Map(list.map(p=>[p.id, uid()]));
  list.forEach((p,k)=>{
    const np=cleanPage({...p, id:map.get(p.id), parentId: k===0 ? parentId : (map.get(p.parentId)||parentId), updated:Date.now(),
      blocks:p.blocks.map(b=>({...b, id:uid(), pageId: b.type==='page' ? map.get(b.pageId) : undefined}))});
    np.blocks=np.blocks.filter(b=>b.type!=='page' || b.pageId);
    if(!np.blocks.length) np.blocks.push(newBlock());
    state.pages.push(np);
  });
  return map.get(list[0].id);
}

let saveTimer, metaTimer;
function setStatus(t){ $('#status').textContent = t; }
function save(touch=true){
  if(touch) cur().updated = Date.now();
  setStatus('Saving…');
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400);
  clearTimeout(metaTimer); metaTimer = setTimeout(updateMeta, 300);
}
function flush(){
  clearTimeout(saveTimer);
  try{ localStorage.setItem(STORE, JSON.stringify(state)); setStatus('Saved'); }
  catch(e){ setStatus('Not saved — browser storage unavailable'); }
}
window.addEventListener('beforeunload', flush);

/* ================= Rendering ================= */
const editor = $('#blocks');
const titleEl = $('#pageTitle');

function renderAll(){ renderSidebar(); renderPage(); }

function renderSidebar(){
  const q = $('#search').value.trim().toLowerCase();
  const list = $('#pageList'); list.innerHTML='';
  const item=(p, depth)=>{
    const kids=childrenOf(p.id).length;
    const d=document.createElement('div');
    d.className='page-item'+(p.id===state.currentId?' active':'')+(p.expanded?' expanded':'');
    d.dataset.id=p.id; d.style.setProperty('--depth', depth);
    d.innerHTML=`<button class="pi-caret" title="${kids?'Show / hide pages inside':''}">${kids && !q ? ic('chevron-forward-outline') : ''}</button>${ic(p.icon)}<span class="pi-title"></span>`+
      `<button class="pi-btn pi-add" title="Add a page inside">${ic('add-outline')}</button><button class="pi-btn pi-del" title="Delete page">${ic('close-outline')}</button>`;
    d.querySelector('.pi-title').textContent = p.title || 'Untitled';
    list.appendChild(d);
    if(!q && p.expanded) childrenOf(p.id).forEach(c=>item(c, depth+1));
  };
  if(q){   // search: flat list of matching pages
    state.pages.filter(p => p.title.toLowerCase().includes(q) || p.blocks.some(b=>stripText(b.html).toLowerCase().includes(q))).forEach(p=>item(p,0));
  } else childrenOf(null).forEach(p=>item(p,0));
  if(!list.children.length) list.innerHTML='<div class="side-empty">No pages found</div>';
}

function renderHeader(){
  const p=cur(), path=[...ancestors(p), p];
  $('#pageIcon').innerHTML = ic(p.icon);
  $('#crumb').innerHTML = path.map((x,k)=>`<a class="crumb-seg${k<path.length-1?' link':''}" data-id="${x.id}">${ic(x.icon)}<span></span></a>`).join('<span class="crumb-sep">/</span>');
  $('#crumb').querySelectorAll('.crumb-seg span').forEach((s,k)=>s.textContent=path[k].title || 'Untitled');
  document.title = (p.title || 'Untitled') + ' · StudyNotes';
}
$('#crumb').addEventListener('click', e=>{ const s=e.target.closest('.crumb-seg.link'); if(s) openPage(s.dataset.id); });

function renderPage(){
  const p=cur();
  if(titleEl.textContent !== p.title) titleEl.textContent = p.title;
  renderHeader(); renderBlocks(); updateMeta();
}

function normalizeIndents(){   // a block can be at most one level deeper than the block above it
  let prev=-1;
  blocks().forEach(b=>{ b.indent=Math.max(0, Math.min(b.indent||0, prev+1)); prev=b.indent; });
}
function renderBlocks(){
  normalizeIndents();
  editor.innerHTML='';
  const bl=blocks(), counters=[]; let hideBelow=Infinity;
  bl.forEach((b,i)=>{
    const d=b.indent;
    if(d>hideBelow) return;            // inside a closed toggle → not shown
    hideBelow=Infinity;
    counters.length=d+1;               // numbering restarts for each nesting level
    counters[d] = b.type==='numbered' ? (counters[d]||0)+1 : 0;
    editor.appendChild(blockEl(b, counters[d]));
    if(b.type==='toggle'){
      if(!b.open) hideBelow=d;
      else if(!(bl[i+1] && bl[i+1].indent>d)){   // open toggle with nothing inside
        const h=document.createElement('div');
        h.className='toggle-empty'; h.dataset.parent=b.id; h.style.setProperty('--indent', d+1);
        h.textContent='Empty toggle. Click to add a block inside.';
        editor.appendChild(h);
      }
    }
  });
}

function blockEl(b,num){
  const el=document.createElement('div');
  el.className='block'+(b.type==='todo'&&b.checked?' checked':'')+(selected.has(b.id)?' selected':'')+(b.type==='toggle'&&b.open?' open':'');
  el.dataset.id=b.id; el.dataset.type=b.type;
  el.style.setProperty('--indent', b.indent||0);
  if(b.color){ if(b.color.startsWith('bg:')) el.dataset.bg=b.color.slice(3); else el.dataset.tc=b.color; }
  el.innerHTML=`<div class="gutter"><button class="add" title="Add a block below">${ic('add-outline')}</button><button class="drag" draggable="true" title="Drag to move · Click for options">${ic('reorder-two-outline')}</button></div><div class="body"></div>`;
  const body=el.querySelector('.body');
  if(b.type==='divider'){ body.innerHTML='<hr>'; return el; }
  if(b.type==='page'){   // link to a sub-page; title and icon come from the page itself
    const pg=getPage(b.pageId);
    body.innerHTML=`<a class="page-link" data-page="${esc(b.pageId)}">${ic(pg ? pg.icon : DEFAULT_ICON)}<span class="pl-title"></span></a>`;
    body.querySelector('.pl-title').textContent = pg ? (pg.title || 'Untitled') : 'Missing page';
    return el;
  }
  if(b.type==='bullet')   body.insertAdjacentHTML('beforeend',`<span class="marker">${['•','◦','▪'][(b.indent||0)%3]}</span>`);
  if(b.type==='toggle')   body.insertAdjacentHTML('beforeend',`<button class="toggle-btn" title="Open / close">${ic('caret-forward')}</button>`);
  if(b.type==='numbered') body.insertAdjacentHTML('beforeend',`<span class="marker">${num}.</span>`);
  if(b.type==='todo')     body.insertAdjacentHTML('beforeend','<span class="check" role="checkbox"></span>');
  if(b.type==='callout')  body.insertAdjacentHTML('beforeend',`<span class="callout-icon">${ic('bulb-outline')}</span>`);
  const c=document.createElement('div');
  c.className='content'; c.contentEditable='true'; c.spellcheck = b.type!=='code';
  c.dataset.placeholder = PLACEHOLDER[b.type] || '';
  c.innerHTML = b.html;
  body.appendChild(c);
  return el;
}

function updateMeta(){
  const p=cur();
  const text = p.blocks.map(b=>stripText(b.html)).join(' ');
  const words = (text.match(/\S+/g)||[]).length;
  const when = new Date(p.updated).toLocaleString([], {dateStyle:'medium', timeStyle:'short'});
  $('#meta').textContent = `Edited ${when} · ${words} word${words===1?'':'s'}`;
}

/* ================= Caret utilities ================= */
const blockOf = node => node && node.closest ? node.closest('.block') : null;
const contentEl = id => editor.querySelector(`.block[data-id="${id}"] .content`);

function pointAt(el, offset){
  const w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){ if(offset<=n.length) return [n,offset]; offset-=n.length; }
  return [el, el.childNodes.length];
}
function caretOffset(el){
  const s=getSelection(); if(!s.rangeCount) return 0;
  const r=s.getRangeAt(0); if(!el.contains(r.startContainer)) return 0;
  const pre=document.createRange(); pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString().length;
}
function setCaret(el, offset){
  el.focus();
  const [n,o]=pointAt(el, offset===Infinity ? 1e9 : offset);
  const r=document.createRange(); r.setStart(n,o); r.collapse(true);
  const s=getSelection(); s.removeAllRanges(); s.addRange(r);
}
function focusBlock(id, pos='end'){
  const el=contentEl(id); if(!el) return;
  setCaret(el, pos==='end' ? Infinity : pos==='start' ? 0 : pos);
  const r=el.getBoundingClientRect();
  if(r.top < 60 || r.bottom > innerHeight-20) el.scrollIntoView({block:'center'});
}
function lineCheck(el, first){
  const s=getSelection(); if(!s.rangeCount) return true;
  const r=s.getRangeAt(0).cloneRange(); r.collapse(first);
  const rects=r.getClientRects();
  if(!rects.length) return first ? caretOffset(el)===0 : caretOffset(el)===el.textContent.length;
  const c=rects[0], box=el.getBoundingClientRect();
  const lh=parseFloat(getComputedStyle(el).lineHeight) || 24;
  return first ? c.top-box.top < lh*0.8 : box.bottom-c.bottom < lh*0.8;
}
function caretRect(el){
  const s=getSelection();
  if(s.rangeCount){ const r=s.getRangeAt(0).cloneRange(); r.collapse(true); const rs=r.getClientRects(); if(rs.length) return rs[0]; }
  return el.getBoundingClientRect();
}
function syncBlock(el){
  const blk=blockOf(el); if(!blk) return;
  const b=getBlock(blk.dataset.id); if(!b) return;
  if(el.innerHTML==='<br>') el.innerHTML='';
  b.html = el.innerHTML;
}
function insertBreak(el){
  const s=getSelection(); if(!s.rangeCount) return;
  const r=s.getRangeAt(0); r.deleteContents();
  const br=document.createElement('br'); r.insertNode(br);
  if(!br.nextSibling) br.after(document.createElement('br'));   // a trailing <br> is needed to show the empty last line
  const nr=document.createRange(); nr.setStartAfter(br); nr.collapse(true);
  s.removeAllRanges(); s.addRange(nr);
  syncBlock(el); save();
}

/* ================= Block operations ================= */
function findEditable(i, dir){   // next visible block you can type in
  const bl=blocks();
  for(let j=i+dir; j>=0 && j<bl.length; j+=dir) if(bl[j].type!=='divider' && contentEl(bl[j].id)) return bl[j];
  return null;
}
const isShown = id => !!editor.querySelector(`.block[data-id="${id}"]`);
function subtreeEnd(i){   // index just after the block's nested children
  const bl=blocks(), d=bl[i].indent||0; let j=i+1;
  while(j<bl.length && (bl[j].indent||0)>d) j++;
  return j;
}
function withDescendants(ids){   // blocks + everything nested under them, in page order
  const bl=blocks(), keep=new Set();
  ids.forEach(id=>{ const i=idx(id); if(i<0) return; const e=subtreeEnd(i); for(let k=i;k<e;k++) keep.add(bl[k].id); });
  return bl.filter(b=>keep.has(b.id));
}
function parentOf(i){
  const bl=blocks(), d=bl[i].indent;
  for(let k=i-1;k>=0;k--) if(bl[k].indent<d) return bl[k];
  return null;
}
function indentBlocks(ids, delta){   // Tab (+1) / Shift+Tab (-1); children move with their parent
  const bl=blocks(), done=new Set(); let changed=false;
  bl.filter(b=>ids.includes(b.id)).forEach(b=>{
    if(done.has(b.id)) return;
    const i=idx(b.id), end=subtreeEnd(i);
    const ok = delta>0 ? (i>0 && b.indent<=bl[i-1].indent && b.indent<8) : b.indent>0;
    for(let k=i;k<end;k++){ done.add(bl[k].id); if(ok) bl[k].indent+=delta; }
    if(ok){
      changed=true;
      if(delta>0){ const p=parentOf(i); if(p && p.type==='toggle') p.open=true; }   // show it inside its new toggle
    }
  });
  return changed;
}
function insertAt(i, nb){ blocks().splice(i,0,nb); renderBlocks(); focusBlock(nb.id,'start'); save(); }

function convert(b, type){
  closeMenu();
  if(type==='divider'){
    const i=idx(b.id), nb=newBlock('text','',{indent:b.indent});
    if(isEmpty(b)){ b.type='divider'; b.html=''; blocks().splice(i+1,0,nb); }
    else blocks().splice(i+1,0,newBlock('divider','',{indent:b.indent}),nb);
    renderBlocks(); focusBlock(nb.id,'start'); save(); return;
  }
  if(type==='page'){   // like Notion: create the sub-page and open it
    const np=createSubpage(cur(), stripText(b.html).trim());
    if(isEmpty(b)){ b.type='page'; b.html=''; b.pageId=np.id; }
    else blocks().splice(subtreeEnd(idx(b.id)), 0, newBlock('page','',{indent:b.indent, pageId:np.id}));
    save(); openPage(np.id); setCaret(titleEl, Infinity); return;
  }
  b.type=type; if(type!=='todo') b.checked=false; if(type==='toggle') b.open=true;
  renderBlocks(); focusBlock(b.id,'end'); save();
}
function deleteBlocks(ids, confirmed){
  if(!ids.length) return;
  ids=withDescendants(ids).map(b=>b.id);   // deleting a toggle deletes what is inside it
  const pageIds=blocks().filter(b=>ids.includes(b.id) && b.type==='page' && getPage(b.pageId)).map(b=>b.pageId);
  if(pageIds.length && !confirmed){   // a page block holds a real page → ask first
    const all=pageIds.flatMap(collectTree), extra=all.length-pageIds.length;
    const name = pageIds.length===1 ? `“${esc(getPage(pageIds[0]).title||'Untitled')}”` : `${pageIds.length} pages`;
    showModal(`<h3>Delete ${name}?</h3><p>${extra ? `This also deletes ${extra} page${extra===1?'':'s'} inside it. ` : ''}This cannot be undone.</p>`,
      [{label:'Cancel'}, {label:'Delete', primary:true, run:()=>deleteBlocks(ids, true)}]);
    return;
  }
  if(pageIds.length){ removePages(pageIds.flatMap(collectTree).map(p=>p.id)); renderSidebar(); }
  const first=Math.min(...ids.map(idx));
  cur().blocks = blocks().filter(b=>!ids.includes(b.id));
  if(!blocks().length) blocks().push(newBlock());
  selected.clear(); renderBlocks();
  const target = findEditable(first, -1) || findEditable(first-1, 1);
  if(target) focusBlock(target.id,'end');
  save();
}
function duplicateBlocks(ids){
  const bl=blocks(), list=withDescendants(ids);
  const copies=list.map(b=>({...b, id:uid()}));
  copies.forEach(c=>{ if(c.type==='page') c.pageId=instantiateTree(snapshotTree(c.pageId), cur().id); });   // duplicate the page too
  bl.splice(Math.max(...list.map(b=>idx(b.id)))+1, 0, ...copies);
  selected=new Set(copies.filter((c,k)=>ids.includes(list[k].id)).map(c=>c.id)); selAnchor=copies[0].id;
  renderBlocks(); renderSidebar(); save();
}
function convertMany(ids, type){
  ids.forEach(id=>{
    const b=getBlock(id); if(!b || b.type==='divider' || b.type==='page') return;
    if(type==='page'){ b.pageId=createSubpage(cur(), stripText(b.html).trim()).id; b.html=''; }   // text becomes the page title
    b.type=type; if(type!=='todo') b.checked=false; if(type==='toggle') b.open=true;
  });
  renderBlocks(); renderSidebar(); save();
}
function setBlockColor(ids, kind, color){
  ids.forEach(id=>{ const b=getBlock(id); if(b) b.color = color==='default' ? '' : (kind==='bg' ? 'bg:'+color : color); });
  renderBlocks(); save();
}
function moveBlock(id, dir){   // moves the block with its children past the neighbouring sibling
  const bl=blocks(), i=idx(id), d=bl[i].indent, end=subtreeEnd(i), group=bl.slice(i,end);
  if(dir<0){
    let k=i-1; while(k>=0 && bl[k].indent>d) k--;
    if(k<0 || bl[k].indent<d) return;
    bl.splice(i, end-i); bl.splice(k, 0, ...group);
  } else {
    if(end>=bl.length || bl[end].indent!==d) return;
    const e2=subtreeEnd(end), after=bl.slice(end,e2);
    bl.splice(i, e2-i, ...after, ...group);
  }
  renderBlocks();
  if(getBlock(id).type!=='divider') focusBlock(id,'end');
  save();
}
function splitBlock(el, b, i){
  const nestable = LIST_TYPES.includes(b.type) || b.type==='toggle';
  // Enter on an empty item: first un-nest it, then end the list
  if(!el.textContent && (nestable || b.indent>0)){
    if(b.indent>0 && indentBlocks([b.id],-1)){ renderBlocks(); focusBlock(b.id,'start'); save(); return; }
    if(nestable){ b.type='text'; b.checked=false; renderBlocks(); focusBlock(b.id,'start'); save(); return; }
  }
  const nextType = nestable ? b.type : 'text';
  // Enter at the very start of a non-empty block: add an empty block above
  if(caretOffset(el)===0 && el.textContent){
    const nb=newBlock(nextType,'',{indent:b.indent}); blocks().splice(i,0,nb); renderBlocks(); focusBlock(b.id,'start'); save(); return;
  }
  const s=getSelection(); const r=s.getRangeAt(0); r.deleteContents();
  const tail=document.createRange(); tail.selectNodeContents(el); tail.setStart(r.startContainer, r.startOffset);
  const tmp=document.createElement('div'); tmp.appendChild(tail.extractContents());
  const afterHtml = tmp.textContent ? tmp.innerHTML : '';
  if(!el.textContent) el.innerHTML='';
  syncBlock(el);
  if(b.type==='toggle' && b.open){        // open toggle → first block inside it
    insertAt(i+1, newBlock('text', afterHtml, {indent:b.indent+1}));
  } else if(b.type==='toggle'){           // closed toggle → next toggle after it
    insertAt(subtreeEnd(i), newBlock('toggle', afterHtml, {indent:b.indent, open:false}));
  } else {
    insertAt(i+1, newBlock(nextType, afterHtml, {indent:b.indent}));
  }
}

/* ================= Editor events ================= */
editor.addEventListener('input', e=>{
  const el=e.target; if(!el.classList || !el.classList.contains('content')) return;
  syncBlock(el);
  const b=getBlock(blockOf(el).dataset.id);
  if(b.type==='text'){
    const type = MD_SHORTCUTS[el.textContent.replace(/ /g,' ')];
    if(type){ b.html=''; convert(b,type); return; }
  }
  checkSlash(el,b);
  save();
});

editor.addEventListener('keydown', e=>{
  const el=e.target; if(!el.classList || !el.classList.contains('content') || e.isComposing) return;
  const id=blockOf(el).dataset.id, b=getBlock(id), i=idx(id);
  const sel=getSelection(); const collapsed = sel.rangeCount && sel.getRangeAt(0).collapsed;

  const mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if(mod && key==='k' && b.type!=='code'){ e.preventDefault(); linkSelection(el); return; }
  if(mod && e.shiftKey && key==='h'){   // re-apply the last used color
    e.preventDefault();
    if(!collapsed && state.recent[0]){ const [k,c]=state.recent[0].split(':'); applyInline(k,c); }
    return;
  }
  if(e.key==='Escape'){   // like Notion: Esc selects the block you are typing in
    e.preventDefault(); e.stopPropagation(); el.blur(); getSelection().removeAllRanges(); selectBlocks([id]); return;
  }
  if(mod && key==='a'){   // second Ctrl+A selects all blocks
    if(!el.textContent || sel.toString().length >= el.textContent.length){
      e.preventDefault(); e.stopPropagation(); el.blur(); getSelection().removeAllRanges(); selectBlocks(blocks().map(x=>x.id)); return;
    }
  }
  if(e.shiftKey && !mod && (e.key==='ArrowUp' || e.key==='ArrowDown') && sel.rangeCount){
    // Shift+arrow past the first/last character of a block switches to selecting blocks
    const pre=document.createRange(); pre.selectNodeContents(el); pre.setEnd(sel.focusNode, sel.focusOffset);
    const fo=pre.toString().length, up=e.key==='ArrowUp';
    let n=blockOf(el)[up?'previousElementSibling':'nextElementSibling'];
    while(n && !n.classList.contains('block')) n=n[up?'previousElementSibling':'nextElementSibling'];
    const next = n ? getBlock(n.dataset.id) : null;
    if(next && (up ? fo===0 : fo===el.textContent.length)){
      e.preventDefault(); e.stopPropagation(); el.blur(); getSelection().removeAllRanges();
      selectBlocks([id, next.id].sort((a,b)=>idx(a)-idx(b)), id); selFocus=next.id; return;
    }
  }

  if(b.type==='code'){
    if(e.key==='Tab' && !e.shiftKey){ e.preventDefault(); document.execCommand('insertText',false,'  '); return; }
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); insertAt(i+1,newBlock('text','',{indent:b.indent})); return; }
  }
  if(e.key==='Tab'){   // nest under the block above / un-nest
    e.preventDefault();
    const pos=caretOffset(el);
    if(indentBlocks([id], e.shiftKey?-1:1)){ renderBlocks(); focusBlock(id,pos); save(); }
    return;
  }
  if(b.type==='code'){
    if(e.key==='Enter'){ e.preventDefault(); insertBreak(el); return; }
  }
  if(e.key==='Enter' && e.shiftKey){ e.preventDefault(); insertBreak(el); return; }
  if(e.key==='Enter'){ e.preventDefault(); splitBlock(el,b,i); return; }

  if(e.key==='Backspace' && collapsed && caretOffset(el)===0){
    if(b.type!=='text'){ e.preventDefault(); b.type='text'; b.checked=false; renderBlocks(); focusBlock(id,'start'); save(); return; }
    if(b.indent>0){ e.preventDefault(); indentBlocks([id],-1); renderBlocks(); focusBlock(id,'start'); save(); return; }
    if(i===0) return;
    e.preventDefault();
    let k=i-1; while(k>=0 && !isShown(blocks()[k].id)) k--;   // skip blocks hidden in closed toggles
    if(k<0) return;
    const prev=blocks()[k];
    if(prev.type==='divider'){ blocks().splice(k,1); renderBlocks(); focusBlock(id,'start'); save(); return; }
    if(prev.type==='page'){ el.blur(); selectBlocks([prev.id]); return; }   // select the page block instead of merging into it
    const join=stripText(prev.html).length;
    prev.html += b.html; blocks().splice(i,1);
    renderBlocks(); focusBlock(prev.id, join); save(); return;
  }

  if((e.key==='ArrowUp' || e.key==='ArrowDown') && !e.shiftKey){
    const up = e.key==='ArrowUp';
    if(lineCheck(el, up)){
      const t=findEditable(i, up?-1:1);
      if(t){ e.preventDefault(); focusBlock(t.id, up?'end':'start'); }
      else if(up){ e.preventDefault(); setCaret(titleEl, Infinity); }
    }
  }
  if(e.key==='ArrowLeft' && collapsed && !e.shiftKey && caretOffset(el)===0){
    const t=findEditable(i,-1); if(t){ e.preventDefault(); focusBlock(t.id,'end'); }
  }
  if(e.key==='ArrowRight' && collapsed && !e.shiftKey && caretOffset(el)===el.textContent.length){
    const t=findEditable(i,1); if(t){ e.preventDefault(); focusBlock(t.id,'start'); }
  }
});

editor.addEventListener('paste', e=>{
  const el=e.target.closest && e.target.closest('.content'); if(!el) return;
  e.preventDefault();
  const text=(e.clipboardData || window.clipboardData).getData('text/plain').replace(/\r/g,'');
  if(clip && text===clip.text){ pasteBlocks(blockOf(el).dataset.id); return; }   // blocks copied in this app
  const url=text.trim();
  if(/^https?:\/\/\S+$/i.test(url) && getBlock(blockOf(el).dataset.id).type!=='code'){
    const s=getSelection();
    if(s.rangeCount && !s.getRangeAt(0).collapsed) document.execCommand('createLink', false, url);   // paste URL over selected text
    else document.execCommand('insertHTML', false, `<a href="${esc(url)}">${esc(url)}</a>&nbsp;`);
    syncBlock(el); save(); return;
  }
  text.split('\n').forEach((line,k)=>{ if(k) insertBreak(el); if(line) document.execCommand('insertText',false,line); });
  syncBlock(el); save();
});

editor.addEventListener('click', e=>{
  const pl=e.target.closest('.page-link');
  if(pl){ if(getPage(pl.dataset.page)) openPage(pl.dataset.page); return; }
  const hint=e.target.closest('.toggle-empty');
  if(hint){ const p=getBlock(hint.dataset.parent); insertAt(idx(p.id)+1, newBlock('text','',{indent:p.indent+1})); return; }
  const blk=blockOf(e.target); if(!blk) return;
  const id=blk.dataset.id, b=getBlock(id);
  if(e.target.closest('.toggle-btn')){
    b.open=!b.open; const ae=document.activeElement, keep=ae && ae.closest && ae.closest('.block');
    renderBlocks(); if(keep && isShown(keep.dataset.id)) focusBlock(keep.dataset.id,'end');
    save(); return;
  }
  const link=e.target.closest('.content a');
  if(link && (e.ctrlKey||e.metaKey) && /^https?:/i.test(link.getAttribute('href')||'')){
    e.preventDefault(); window.open(link.getAttribute('href'), '_blank', 'noopener'); return;
  }
  if(e.target.closest('.check')){
    b.checked=!b.checked; blk.classList.toggle('checked', b.checked); save(); return;
  }
  if(e.target.closest('.add')){
    let target=b;
    if(!(b.type==='text' && isEmpty(b))){ target=newBlock('text','',{indent:b.indent}); blocks().splice(subtreeEnd(idx(id)),0,target); }
    target.html='/'; renderBlocks(); focusBlock(target.id,'end');
    checkSlash(contentEl(target.id), target); save(); return;
  }
  if(e.target.closest('.drag')) openBlockMenu(id, e.target.closest('.drag'));
});

/* Drag & drop to reorder */
let dragId=null, dropTarget=null;
const clearDrop = () => editor.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));
editor.addEventListener('dragstart', e=>{
  const t = e.target.nodeType===3 ? e.target.parentElement : e.target;
  const h = t.closest && t.closest('.drag');
  if(!h){ e.preventDefault(); return; }
  const blk=blockOf(h); dragId=blk.dataset.id;
  if(!selected.has(dragId)) clearSelection();   // dragging a selected block moves the whole selection
  e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','');
  e.dataTransfer.setDragImage(blk, 20, 12);
  blk.classList.add('dragging'); closeMenu(); hideToolbar();
  if(selected.size>1) editor.querySelectorAll('.block.selected').forEach(x=>x.classList.add('dragging'));
});
editor.addEventListener('dragover', e=>{
  if(!dragId) return; e.preventDefault();
  const t = e.target.nodeType===3 ? e.target.parentElement : e.target;
  const blk=blockOf(t); if(!blk || blk.dataset.id===dragId) return;
  if(selected.has(dragId) && selected.has(blk.dataset.id)) return;
  clearDrop();
  const r=blk.getBoundingClientRect(); const after = e.clientY > r.top + r.height/2;
  blk.classList.add(after?'drop-after':'drop-before');
  dropTarget={id:blk.dataset.id, after};
});
editor.addEventListener('drop', e=>{
  e.preventDefault();
  if(dragId && dropTarget){
    const roots = selected.has(dragId) && selected.size>1 ? selectedInOrder() : [getBlock(dragId)];
    const moving = withDescendants(roots.map(b=>b.id));          // children travel with their parent
    if(!moving.some(m=>m.id===dropTarget.id)){
      const target=getBlock(dropTarget.id);
      cur().blocks = blocks().filter(b=>!moving.includes(b));
      const ti=idx(dropTarget.id); let at, level;
      if(!dropTarget.after){ at=ti; level=target.indent; }
      else if(target.type==='toggle' && target.open){ at=ti+1; level=target.indent+1; }   // drop into an open toggle
      else { at=subtreeEnd(ti); level=target.indent; }
      const delta=level-Math.min(...moving.map(m=>m.indent));
      moving.forEach(m=>m.indent=Math.max(0, m.indent+delta));
      blocks().splice(at, 0, ...moving);
      renderBlocks(); save();
    }
  }
});
editor.addEventListener('dragend', ()=>{
  dragId=null; dropTarget=null; clearDrop();
  editor.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));
});

/* Click below the last block → continue writing */
$('#tail').addEventListener('click', ()=>{

  else insertAt(bl.length, newBlock());
});

/* ================= Title ================= */
titleEl.addEventListener('input', ()=>{
